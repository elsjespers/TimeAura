        : v < p ? `telt voor ${hm(v)}, je rooster heeft ${hm(p)}: ${hm(p - v)} zelf aanvullen`
        : `${hm(p)} die je niet hoeft te werken`;
      return `<div class="hrow ${h.date < t ? "past" : ""}"><span class="d">${DSHORT[dow(h.date)]} ${fmtShort(h.date)}</span><span class="n">${esc(h.name)}<small>${eff}</small></span><span class="pill ${p === 0 ? "warn" : v < p ? "neg" : "hol"}">${hm(v)}</span></div>`;
    }).join("");
    const other = TYPES.filter(ty => !ty.budget).map(ty => {
      const list = state.abs.filter(a => a.type === ty.code && String(a.date).slice(0, 4) === String(Y));
      const days = sum(list, a => Math.min(1, (a.min || 0) / (plannedMin(a.date) || c.fullDay)));
      return { ty, n: list.length, days, min: sum(list, a => a.min || 0) };
    });
    viewEl.innerHTML = `
      <div class="page-head">
        <h1>Je <em>tellers</em></h1>
        ${yearStepper(Y)}
      </div>
      <div class="grid">
        <div class="col span-7">
          <section class="card hero">
            <span class="eyebrow">Plus/min-saldo nu</span>
            <div class="hero-value num ${signCls(led.balance)}">${hm(led.balance, true)}</div>
            <p class="hero-note">t.e.m. gisteren · ${led.balance >= 0 ? "zoveel heb je méér gewerkt dan je rooster" : "zoveel moet je nog inhalen"}</p>
          </section>
          <section class="card">
            <div class="card-head"><h2>Zo is je saldo opgebouwd</h2><span class="sub">${Y}</span></div>
            <p class="explain">Elke dag vergelijkt TimeAura wat je <b>gewerkt</b> hebt plus je <b>betaalde afwezigheden</b> (verlof, ziekte, opleiding…) met wat je volgens je rooster <b>moest</b>. Het verschil gaat bij je saldo. Neem je <b>recup</b>, dan registreer je geen uren voor die dag en daalt je saldo met de uren die je moest werken.</p>
            ${months.length || startInYear ? `<div class="table-wrap"><table class="ledger"><thead><tr><th>Maand</th><th>Moest</th><th>Gewerkt</th><th>Afwezig</th><th>Verschil</th><th>Saldo</th></tr></thead><tbody>
              <tr class="start"><td>${startInYear ? "Startsaldo " + esc(fmtShort(c.startDate)) : "Saldo begin " + Y}</td><td></td><td></td><td></td><td></td><td>${hm(startInYear ? c.startBalance : prevEnd ? prevEnd.end : c.startBalance, true)}</td></tr>
              ${ledgerRows}</tbody></table></div>` : `<p class="explain" style="margin:0">Voor ${Y} is er nog niets te tellen. Je saldo telt vanaf ${esc(fmtLong(c.startDate))}.</p>`}
            ${yearRecup ? `<p class="explain" style="margin:12px 0 0">Recup opgenomen in ${Y}: <b>${hm(yearRecup)}</b> (zit al in de cijfers hierboven).</p>` : ""}
          </section>
          <section class="card">
            <div class="card-head"><h2>Thuiswerk, ziekte en andere</h2><span class="sub">${Y}</span></div>
            <div class="table-wrap"><table class="ledger" style="min-width:0"><thead><tr><th>Soort</th><th>Keer</th><th>≈ Dagen</th><th>Uren</th></tr></thead><tbody>
              ${other.every(o => !o.n) ? `<tr><td colspan="4" class="muted">Geen thuiswerk, ziekte of andere afwezigheden in ${Y}.</td></tr>` : ""}
              ${other.filter(o => o.n).map(o =>`<tr><td>${esc(o.ty.label)}</td><td>${o.n}</td><td>${fmtNum(o.days)}</td><td>${hm(o.min)}</td></tr>`).join("")}
            </tbody></table></div>
          </section>
        </div>
        <div class="col span-5">
          ${leaveBalanceCard(Y, "Je verlofdagen", "#verlof")}
          <section class="card">
            <div class="card-head"><h2>Feestdagen ${Y}</h2><a class="link" href="#instellingen" style="font-size:14px">Beheren</a></div>
            <p class="explain">Elke feestdag telt voor een aantal uren: een officiële voor ${hm(c.fullDay)}, een bijkomende voor ${hm(c.extraHolidayMin)}. Op een werkdag telt hij als gewerkt, maar nooit voor meer dan je rooster die dag. Valt hij op een dag dat je niet werkt, dan krijg je zijn uren als vervanguren om later op te nemen.</p>
            <div class="hol-list">${hols || `<p class="explain">Geen feestdagen voor ${Y}.</p>`}</div>
          </section>
        </div>
      </div>`;
    bindYearStepper();
  }

  const yearStepper = Y => `<div class="stepper"><button class="icon-btn" id="yPrev" aria-label="Vorig jaar">‹</button><span>${Y}</span><button class="icon-btn" id="yNext" aria-label="Volgend jaar">›</button></div>`;
  function bindYearStepper() {
    $("#yPrev").onclick = () => { state.year--; render(); };
    $("#yNext").onclick = () => { state.year++; render(); };
  }
  function leaveBalanceCard(Y, linkText, href) {
    const budget = TYPES.filter(ty => ty.budget).map(ty => ({ ty, s: leaveStats(Y, ty.code) }))
      .filter(o => o.ty.code === "verlof" || o.s.right || o.s.taken || o.s.plan || o.s.before).map(o => leaveBlock(o.ty, o.s, false)).join("");
    return `<section class="card">
      <div class="card-head"><h2>Verlof ${Y}</h2><a class="link" href="${href}" style="font-size:14px">${linkText}</a></div>
      <p class="explain">Verlof telt in <b>uren</b>. Een verlofdag kost wat je die dag moest werken${(sd => sd ? `: <b>${hm(cfg().fullDay)}</b>, op ${DAYS[sd.dow]} maar <b>${hm(sd.min)}</b>` : `, bij jou <b>${hm(Math.max(...scheduleFor(todayStr()).days.map(x => x || 0)))}</b>`)(shortDay(todayStr()))}.</p>
      <div class="leave">${budget}</div>
      <div class="legend"><span><i style="background:var(--rose)"></i>opgenomen</span><span><i style="background:var(--peach)"></i>gepland</span><span><i style="background:var(--faint)"></i>vóór TimeAura</span></div>
    </section>`;
  }

  /* ---------- Verlof ---------- */
  function renderLeave() {
    const c = cfg(), Y = state.year, t = todayStr();
    // Every leave day of the year, planned ones first, each one tappable to edit.
    const LEAVE_CODES = TYPES.filter(ty => ty.budget || ty.code === "recup").map(ty => ty.code);
    const yearLeave = state.abs.filter(a => LEAVE_CODES.includes(a.type) && String(a.date).slice(0, 4) === String(Y));
    // Holidays sit in the same list (filter "Feestdagen"); they are not leave, so they stay out of the leave totals.
    const yearHols = state.hol.filter(h => String(h.date).slice(0, 4) === String(Y)).map(h => { const p = plannedMin(h.date), v = holMin(h); return { holiday: h, date: h.date, value: v, min: p ? Math.min(v, p) : v }; });
    const usedCodes = LEAVE_CODES.filter(code => yearLeave.some(a => a.type === code));
    const filters = [...usedCodes, ...(yearHols.length ? ["feestdag"] : [])];
    if (state.leaveFilter && !filters.includes(state.leaveFilter)) state.leaveFilter = "";
    const lf = state.leaveFilter;
    const shown = [...(lf === "feestdag" ? [] : yearLeave.filter(a => !lf || a.type === lf)), ...(!lf || lf === "feestdag" ? yearHols : [])];
    const leaveRow = a => {
      if (a.holiday) {
        const p = plannedMin(a.date), v = a.value;
        const what = p === 0 ? `valt op een vrije dag: ${hm(v)} vervanguren` : v < p ? `telt voor ${hm(v)}, je rooster heeft ${hm(p)}: ${hm(p - v)} zelf aanvullen` : `je hoeft je ${hm(p)} niet te werken`;
        return `<button type="button" class="lrow hol ${a.date < t ? "past" : ""}" data-day="${a.date}" aria-label="${esc(a.holiday.name)} op ${fmtDate(a.date)} bekijken">
          <span class="d"><b>${DSHORT[dow(a.date)]}</b>${fmtShort(a.date)}</span>
          <span class="n">${esc(a.holiday.name)}<small>Feestdag · ${what}</small></span>
          <span class="num">${hm(a.min)}</span><span class="edit" aria-hidden="true">›</span></button>`;
      }
      const ty = typeOf(a.type), p = plannedMin(a.date), part = p && a.min < p ? (a.min === Math.round(p / 2) ? "halve dag" : "deel van de dag") : "hele dag";
      return `<button type="button" class="lrow ${a.date < t ? "past" : ""}" data-abs="${esc(a.id)}" data-date="${a.date}" aria-label="${esc(ty.label)} op ${fmtDate(a.date)} aanpassen">
        <span class="d"><b>${DSHORT[dow(a.date)]}</b>${fmtShort(a.date)}</span>
        <span class="n">${esc(ty.label)}<small>${part}${a.hol && state.hol.find(h => h.id === a.hol) ? " · voor " + esc(state.hol.find(h => h.id === a.hol).name) : ""}${a.note ? " · " + esc(a.note) : ""}</small></span>
        <span class="num">${hm(a.min)}</span><span class="edit" aria-hidden="true">✎</span></button>`;
    };
    const planned = shown.filter(a => a.date >= t).sort((a, b) => a.date < b.date ? -1 : 1);
    const taken = shown.filter(a => a.date < t).sort((a, b) => a.date > b.date ? -1 : 1);
    const leaveGroup = (title, list, empty) => {
      const lv = list.filter(a => !a.holiday), hs = list.length - lv.length;
      const parts = [];
      if (lv.length || !hs) parts.push(`${lv.length} ${lv.length === 1 ? "verlofdag" : "verlofdagen"} · ${hm(sum(lv, a => a.min || 0))}`);
      if (hs) parts.push(`${hs} ${hs === 1 ? "feestdag" : "feestdagen"}`);
      return `<div class="lgroup"><div class="lgroup-head"><b>${title}</b><span>${parts.join(" · ")}</span></div>${list.length ? list.map(leaveRow).join("") : `<p class="explain" style="margin:6px 0 0">${empty}</p>`}</div>`;
    };
    const leaveList = `
      ${filters.length > 1 ? `<div class="chips lfilter">${["", ...filters].map(code => `<label class="chip"><input type="radio" name="lf" value="${code}" ${code === (lf || "") ? "checked" : ""}><span>${code === "feestdag" ? "Feestdagen" : code ? esc(typeOf(code).label) : "Alles"}</span></label>`).join("")}</div>` : ""}
      ${leaveGroup("Ingepland", planned, `Nog geen verlof ingepland na vandaag.`)}
      ${leaveGroup("Al opgenomen", taken, `Nog geen verlof opgenomen in ${Y}${c.startDate.slice(0, 4) === String(Y) ? " sinds de start van TimeAura" : ""}.`)}`;
    const typeTotals = usedCodes.map(code => {
      const list = yearLeave.filter(a => a.type === code);
      return `<tr><td>${esc(typeOf(code).label)}</td><td>${fmtNum(sum(list, a => Math.min(1, (a.min || 0) / (plannedMin(a.date) || c.fullDay))))}</td><td>${hm(sum(list.filter(a => a.date < t), a => a.min || 0))}</td><td>${hm(sum(list.filter(a => a.date >= t), a => a.min || 0))}</td></tr>`;
    }).join("") + (yearHols.length ? `<tr><td>Feestdagen</td><td>${yearHols.length}</td><td>${hm(sum(yearHols.filter(a => a.date < t), a => a.min))}</td><td>${hm(sum(yearHols.filter(a => a.date >= t), a => a.min))}</td></tr>` : "");
    // Holidays on a day off, each with the day(s) you take instead.
    const fh = freeHols(Y), defDate = String(Y) === t.slice(0, 4) ? t : Y + "-01-02";
    const loose = state.abs.filter(a => a.type === "vervangdag" && String(a.date).slice(0, 4) === String(Y) && !state.hol.some(h => h.id === a.hol));
    const vdLine = a => `<button type="button" class="vd-take ${a.date < t ? "past" : ""}" data-abs="${esc(a.id)}" data-date="${a.date}" aria-label="Vervangdag op ${fmtDate(a.date)} aanpassen"><span>→ ${DSHORT[dow(a.date)]} ${fmtShort(a.date)}${a.date.slice(0, 4) !== String(Y) ? " " + a.date.slice(0, 4) : ""}</span><span class="num">${hm(a.min)}</span><small>${a.date < t ? "opgenomen" : "ingepland"}</small><span class="edit" aria-hidden="true">✎</span></button>`;
    const vdCard = fh.length || loose.length ? `<section class="card">
            <div class="card-head"><h2>Vervangdagen ${Y}</h2><span class="sub">feestdagen op een vrije dag</span></div>
            <p class="explain">Deze feestdagen vallen op een dag dat je niet werkt. Hun uren mag je op een andere dag opnemen. Kies per feestdag wanneer je hem in de plaats neemt.</p>
            ${fh.map(h => {
              const takes = vdFor(h.id).sort((a, b) => a.date < b.date ? -1 : 1), left = vdLeft(h);
              const st = !takes.length ? `<span class="pill warn">nog te kiezen</span>` : left > 0 ? `<span class="pill warn">nog ${hm(left)}</span>` : left < 0 ? `<span class="pill neg">${hm(-left)} te veel</span>` : takes.every(a => a.date < t) ? `<span class="pill hol">opgenomen</span>` : `<span class="pill pos">ingepland</span>`;
              return `<div class="vd">
                <div class="vd-head"><span class="d"><b>${DSHORT[dow(h.date)]}</b>${fmtShort(h.date)}</span><span class="n">${esc(h.name)}<small>telt voor ${hm(holMin(h))}</small></span>${st}</div>
                ${takes.map(vdLine).join("")}
                ${left > 0 ? `<button type="button" class="btn small soft vd-pick" data-vd-hol="${esc(h.id)}" data-date="${defDate}">${takes.length ? "+ Rest inplannen" : "Kies vervangdag"}</button>` : ""}
              </div>`;
            }).join("")}
            ${loose.length ? `<div class="vd"><div class="vd-head"><span class="d"></span><span class="n">Niet aan een feestdag gekoppeld<small>tik om te kiezen voor welke feestdag</small></span></div>${loose.map(vdLine).join("")}</div>` : ""}
          </section>` : "";
    viewEl.innerHTML = `
      <div class="page-head">
        <h1>Je <em>verlof</em></h1>
        ${yearStepper(Y)}
      </div>
      <div class="grid">
        <div class="col span-7">
          ${vdCard}
          <section class="card" id="leaveDays">
            <div class="card-head"><h2>Je verlofdagen ${Y}</h2><button type="button" class="btn small primary" data-add-abs data-date="${String(Y) === t.slice(0, 4) ? t : Y + "-01-02"}">+ Verlof inplannen</button></div>
            <p class="explain">Tik op een dag om hem aan te passen, naar een andere datum te verplaatsen of te verwijderen.</p>
            ${leaveList}
          </section>
        </div>
        <div class="col span-5">
          ${leaveBalanceCard(Y, "Recht aanpassen", "#instellingen")}
          ${typeTotals ? `<section class="card">
            <div class="card-head"><h2>Per soort</h2><span class="sub">${Y}</span></div>
            <div class="table-wrap"><table class="ledger" style="min-width:0"><thead><tr><th>Soort</th><th>≈ Dagen</th><th>Opgenomen</th><th>Ingepland</th></tr></thead><tbody>${typeTotals}</tbody></table></div>
          </section>` : ""}
        </div>
      </div>`;
    bindYearStepper();
    viewEl.querySelectorAll('input[name="lf"]').forEach(r => r.onchange = () => { state.leaveFilter = r.value; render(); });
  }

  /* ---------- First start: your own regime ---------- */
  const PRESETS = [
    { label: "Voltijds", days: [0, 456, 456, 456, 456, 456, 0], extra: 456 },
    { label: "90% (wo-namiddag vrij)", days: [0, 456, 456, 228, 456, 456, 0], extra: 412 },
    { label: "80% (woensdag vrij)", days: [0, 456, 456, 0, 456, 456, 0], extra: 365 },
    { label: "50% (ma, di, wo-vm)", days: [0, 456, 456, 228, 0, 0, 0], extra: 228 }
  ];
  function renderSetup() {
    const p = PRESETS[0], t = todayStr();
    viewEl.innerHTML = `
      <div class="page-head"><h1>Welkom bij Time<em>Aura</em></h1></div>
      <form id="setupForm" class="card stack" style="max-width:720px" novalidate>
        ${CLIENT_ID ? `<div class="preview" style="display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center"><span style="flex:1 1 220px">Gebruik je TimeAura al op een ander toestel? Meld je aan met hetzelfde Google-account, dan komen je uren en instellingen hierheen.</span><button type="button" class="btn small primary" data-cloud-sync>Aanmelden met Google</button></div>` : ""}
        <p class="explain" style="margin:0">Stel eerst je eigen werkregime in. Je kan alles later nog aanpassen bij <b>Instellingen</b>.${WEB ? " Je uren blijven alleen op dit toestel: niemand anders ziet ze." : ""}</p>
        <div class="field"><span>1. Je regime</span>
          <div class="chips">${PRESETS.map((x, n) => `<label class="chip"><input type="radio" name="preset" value="${n}" ${n === 0 ? "checked" : ""}><span>${x.label}</span></label>`).join("")}</div>
        </div>
        <div class="field"><span>Zoveel werk je per dag, zonder pauze (laat leeg als je vrij bent)</span>
          <div class="sched">${ORDER.map(d => `<label class="field"><span>${DSHORT[d]}</span><input class="input num" name="d${d}" value="${p.days[d] ? hm(p.days[d]) : ""}" placeholder="vrij"></label>`).join("")}</div>
          <span class="muted" style="font-size:13px">Week: <b class="num" id="setupTotal"></b></span>
        </div>
        <div class="form-grid">
          <label class="field"><span>2. Een bijkomende feestdag telt voor</span><input class="input num" name="extra" value="${hm(p.extra)}"><small class="muted">Voltijds is dat een hele dag. Deeltijds vaak minder: vraag na bij HR.</small></label>
          <label class="field"><span>Middagpauze bij in- en uittikken</span><input class="input num" name="pause" value="30" inputmode="numeric"><small class="muted">minuten, als je meer dan 6 uur aanwezig bent</small></label>
        </div>
        <label class="chip" style="align-self:start"><input type="checkbox" name="extraDays" checked><span>Ik krijg ook 11 juli en 26 december vrij</span></label>
        <div class="form-grid">
          <label class="field"><span>3. Je tellers beginnen op</span><input class="input" type="date" name="start" value="${t}"></label>
          <label class="field"><span>Je plus/min-saldo op die dag ('s morgens)</span><input class="input num" name="balance" value="0u00" placeholder="bv. +2u15 of -0u30"></label>
        </div>
        <p class="explain" style="margin:0">Je saldo vind je in het systeem van je werkgever. Je <b>verlofrecht</b> vul je daarna in bij Instellingen.</p>
        <p class="form-error" id="setupErr" hidden></p>
        <div class="form-actions"><span></span><button class="btn primary">TimeAura starten</button></div>
      </form>`;
    const f = $("#setupForm");
    const days = () => [0, 1, 2, 3, 4, 5, 6].map(d => { const v = f.elements["d" + d].value.trim(); return v ? parseDur(v) : 0; });
    const upd = () => { const ds = days(); $("#setupTotal").textContent = ds.some(isNaN) ? "—" : hm(sum(ds, x => x)); };
    f.querySelectorAll('input[name="preset"]').forEach(r => r.onchange = () => {
      const x = PRESETS[+r.value];
      ORDER.forEach(d => f.elements["d" + d].value = x.days[d] ? hm(x.days[d]) : "");
      f.elements.extra.value = hm(x.extra); upd();
    });
    f.addEventListener("input", upd); upd();
    f.onsubmit = async e => {
      e.preventDefault(); const err = $("#setupErr"), show = m => { err.textContent = m; err.hidden = false; };
      const ds = days(), extra = parseDur(f.elements.extra.value), bal = parseDur(f.elements.balance.value || "0"), pause = Math.round(+f.elements.pause.value);
      if (ds.some(x => isNaN(x) || x < 0 || x > 1440)) return show("Typ de uren per dag als 7u36 of 7:36.");
      if (!sum(ds, x => x)) return show("Vul minstens één werkdag in.");
      if (isNaN(extra) || extra < 0) return show("Typ wat een bijkomende feestdag waard is, bv. 7u36.");
      if (isNaN(bal)) return show("Typ je saldo als +2u15 of -0u30.");
      if (!isDate(f.elements.start.value)) return show("Kies de dag waarop je tellers beginnen.");
      const extraDays = f.elements.extraDays.checked;
      if (!extraDays) for (const h of state.hol.filter(h => /^e/.test(h.id))) await del("hol", h.id);
      await saveCfg({ ...DEFAULT_CFG(), schedules: [{ from: "2000-01-01", days: ds }], fullDay: Math.max(...ds), extraHolidayMin: extra,
        pauseDefault: isNaN(pause) || pause < 0 ? 30 : pause, startDate: f.elements.start.value, startBalance: bal, extraDays }, true);
      try { if (!localStorage.getItem(BACKUP_KEY)) localStorage.setItem(BACKUP_KEY, String(Date.now())); } catch (e) {}
      toast(CLIENT_ID && !cloudOn() ? "Klaar! Gebruik je ook een ander toestel? Meld je aan bij Instellingen." : "Klaar! Tik in of registreer je eerste dag"); route("vandaag");
    };
  }

  /* ---------- Instellingen ---------- */
  const ORDER = [1, 2, 3, 4, 5, 6, 0];
  function renderSettings() {
    const c = cfg(), Y = state.year;
    state.cfgShown = JSON.stringify(state.cfg || null); state.settingsDirty = false;
    const scheds = c.schedules.slice().sort((a, b) => a.from < b.from ? -1 : 1);
    const schedHtml = scheds.map((s, n) => {
      const tot = sum(s.days, x => x || 0);
      return `<div class="sched-card" data-sched="${n}">
        <div class="row"><b>${n === 0 ? "Vanaf het begin" : "Vanaf " + esc(fmtLong(s.from))}</b>${n ? `<button type="button" class="btn small ghost" data-del-sched="${n}">Verwijderen</button>` : ""}</div>
        ${n ? `<label class="field"><span>Geldt vanaf</span><input class="input" type="date" name="from" value="${esc(s.from)}"></label>` : ""}
        <div class="sched">${ORDER.map(d => `<label class="field"><span>${DSHORT[d]}</span><input class="input num" name="d${d}" value="${s.days[d] ? hm(s.days[d]) : ""}" placeholder="vrij" inputmode="text"></label>`).join("")}</div>
        <span class="muted" style="font-size:13px">Week: <b class="num" data-sched-total>${hm(tot)}</b> = ${fmtNum(tot / (c.fullDay * 5) * 100)}% van een voltijdse week van ${hm(c.fullDay * 5)}</span>
      </div>`;
    }).join("");
    const r = (c.rights || {})[Y] || {};
    const legal = 4 * weekMinutes(Y + "-07-01");
    const rightsHtml = TYPES.filter(ty => ty.budget === true).map(ty => {
      const x = r[ty.code] || {};
      return `<div class="form-grid" style="align-items:end">
        <label class="field"><span>${esc(ty.label)}: recht</span><input class="input num" name="r_${ty.code}" value="${x.min ? hm(x.min) : ""}" placeholder="bv. 136u16"></label>
        <label class="field"><span>Al opgenomen vóór TimeAura</span><input class="input num" name="b_${ty.code}" value="${x.before ? hm(x.before) : ""}" placeholder="0u00"></label>
      </div>`;
    }).join("");
    const vd = leaveStats(Y, "vervangdag");
    const hols = state.hol.filter(h => String(h.date).slice(0, 4) === String(Y)).sort((a, b) => a.date < b.date ? -1 : 1);
    viewEl.innerHTML = `
      <div class="page-head"><h1>Je <em>instellingen</em></h1></div>
      <div class="grid">
        <div class="col span-7">
          <form class="card" id="schedForm">
            <div class="card-head"><h2>Weekrooster</h2></div>
            <p class="explain">Zo lang moet je per dag werken, <b>zonder</b> je pauze. Typ bijvoorbeeld <b>7u36</b> of <b>7:36</b>, of laat leeg als je die dag vrij bent. Verandert je regime later, voeg dan een nieuw rooster toe vanaf die datum: je oude weken blijven dan juist geteld.</p>
            ${schedHtml}
            <div class="actions" style="justify-content:space-between">
              <span style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input class="input" type="date" id="newSchedFrom" style="width:auto" aria-label="Nieuw rooster vanaf"><button type="button" class="btn small soft" id="addSched">+ Nieuw rooster vanaf</button></span>
              <button class="btn primary">Rooster bewaren</button>
            </div>
          </form>
          <form class="card" id="baseForm">
            <div class="card-head"><h2>Saldo en pauze</h2></div>
            <div class="settings-section stack">
              <p class="explain" style="margin:0">Kijk in het systeem van je werkgever hoeveel plus- of min-uren je op een bepaalde dag had, en neem dat over. Vanaf die dag rekent TimeAura verder.</p>
              <div class="form-grid">
                <label class="field"><span>Startdatum</span><input class="input" type="date" name="startDate" value="${esc(c.startDate)}" required></label>
                <label class="field"><span>Saldo bij de start</span><input class="input num" name="startBalance" value="${hm(c.startBalance, true)}" placeholder="+2u15 of −1u30"></label>
              </div>
            </div>
            <div class="settings-section stack">
              <p class="explain" style="margin:0">Bij in- en uittikken trekt TimeAura automatisch je pauze af, als je die dag maar één keer intikt en uittikt. Tik je uit voor je lunch, dan telt die tijd vanzelf niet mee.</p>
              <div class="form-grid">
                <label class="field"><span>Pauze (minuten)</span><input class="input num" name="pauseDefault" type="number" min="0" max="240" value="${c.pauseDefault}"></label>
                <label class="field"><span>Als je langer blijft dan</span><input class="input num" name="pauseAfter" value="${hm(c.pauseAfter)}"></label>
                <label class="field"><span>Een volledige dag</span><input class="input num" name="fullDay" value="${hm(c.fullDay)}"></label>
                <label class="field"><span>Bijkomende feestdag</span><input class="input num" name="extraHolidayMin" value="${hm(c.extraHolidayMin)}"></label>
              </div>
              <p class="explain" style="margin:0;font-size:13px">Een volledige dag is ook wat een officiële feestdag waard is. Werk je deeltijds, dan telt een bijkomende feestdag (zoals 11 juli of 26 december) vaak minder. Vraag bij twijfel na bij HR.</p>
            </div>
            <div class="actions" style="justify-content:flex-end"><button class="btn primary">Bewaren</button></div>
          </form>
          <section class="card" id="cloudCard" hidden></section>
          <section class="card" id="dataCard"></section>
        </div>
        <div class="col span-5">
          <form class="card" id="rightsForm">
            <div class="card-head"><h2>Verlofrecht</h2>
              <div class="stepper"><button type="button" class="icon-btn" id="ryPrev" aria-label="Vorig jaar">‹</button><span style="min-width:60px">${Y}</span><button type="button" class="icon-btn" id="ryNext" aria-label="Volgend jaar">›</button></div></div>
            <p class="explain">Neem de uren over die je werkgever toont. Wettelijk verlof is 4 keer je weekuren: <b>4 × ${hm(weekMinutes(Y + "-07-01"))} = ${hm(legal)}</b> <button type="button" class="btn small soft" id="useLegal" style="min-height:30px;padding:2px 12px">Gebruik dit</button></p>
            <div class="stack">${rightsHtml}
              <label class="field"><span>Vervanguren feestdagen</span><input class="input num" name="vd_min" value="${r.vervangdag && r.vervangdag.min != null && r.vervangdag.min !== "" ? hm(r.vervangdag.min) : ""}" placeholder="automatisch: ${hm(vd.auto)}"></label>
              <p class="explain" style="margin:-6px 0 0;font-size:13px">Laat leeg: dan telt TimeAura de uren van de feestdagen die op een vrije dag vallen. Vul alleen in als je werkgever iets anders toont.</p>
            </div>
            <div class="actions" style="justify-content:flex-end"><button class="btn primary">Verlofrecht ${Y} bewaren</button></div>
          </form>
          <section class="card">
            <div class="card-head"><h2>Feestdagen ${Y}</h2></div>
            <p class="explain">De 10 wettelijke feestdagen staan er elk jaar vanzelf en tellen voor <b>${hm(c.fullDay)}</b>. Ook de bijkomende dagen van je werkgever, 11 juli en 26 december, komen er elk jaar vanzelf bij; die en feestdagen die je zelf toevoegt tellen standaard voor <b>${hm(c.extraHolidayMin)}</b>. Je kan de uren per feestdag aanpassen; maak het vak leeg om terug de standaard te gebruiken.</p>
            <div class="hol-list">${hols.map(h => `<div class="hrow edit"><span class="d">${DSHORT[dow(h.date)]} ${fmtShort(h.date)}</span><span class="n">${esc(h.name)}<small>${isLegalHol(h) ? "officieel" : "bijkomend"}</small></span><input class="input num hol-min" data-hol-min="${esc(h.id)}" value="${h.min != null && h.min !== "" ? hm(h.min) : ""}" placeholder="${hm(holMin({ ...h, min: null }))}" aria-label="${esc(h.name)} telt voor"><button type="button" class="icon-btn" data-del-hol="${esc(h.id)}" aria-label="${esc(h.name)} verwijderen">×</button></div>`).join("") || `<p class="explain">Nog geen feestdagen voor ${Y}.</p>`}</div>
            <form id="holForm" class="form-grid" style="margin-top:14px;align-items:end">
              <label class="field"><span>Datum</span><input class="input" type="date" name="date" required></label>
              <label class="field"><span>Naam</span><input class="input" name="name" placeholder="bv. Tweede kerstdag" required maxlength="60"></label>
              <label class="field"><span>Telt voor</span><input class="input num" name="min" placeholder="${hm(c.extraHolidayMin)}"></label>
              <button class="btn soft">+ Toevoegen</button>
            </form>
          </section>
        </div>
      </div>`;
    renderCloudCard(); renderDataCard();
    if (state.settingsMsg) { toast(state.settingsMsg); state.settingsMsg = null; }
    const sf = $("#schedForm");
    sf.addEventListener("input", e => {
      const card = e.target.closest("[data-sched]"); if (!card) return;
      const tot = sum(ORDER, d => { const v = parseDur(card.querySelector(`[name="d${d}"]`).value); return isNaN(v) ? 0 : v; });
      card.querySelector("[data-sched-total]").textContent = hm(tot);
    });
    const readScheds = () => {
      const out = [];
      sf.querySelectorAll("[data-sched]").forEach((card, n) => {
        const days = [0, 0, 0, 0, 0, 0, 0];
        ORDER.forEach(d => { const raw = card.querySelector(`[name="d${d}"]`).value; const v = raw.trim() ? parseDur(raw) : 0; days[d] = isNaN(v) || v < 0 ? NaN : Math.min(v, 1440); });
        const fromEl = card.querySelector('[name="from"]');
        out.push({ from: n === 0 ? "2000-01-01" : fromEl.value, days });
      });
      return out;
    };
    sf.onsubmit = async e => {
      e.preventDefault();
      const list = readScheds();
      if (list.some(s => s.days.some(isNaN))) { toast("Typ de uren als 7u36 of 7:36"); return; }
      if (list.some(s => !isDate(s.from))) { toast("Kies een datum voor elk nieuw rooster"); return; }
      await saveCfg({ ...cfg(), schedules: list }); state.settingsMsg = "Rooster bewaard"; render();
    };
    $("#addSched").onclick = async () => {
      const from = $("#newSchedFrom").value;
      if (!isDate(from)) { toast("Kies eerst vanaf welke datum het nieuwe rooster geldt"); $("#newSchedFrom").focus(); return; }
      const list = readScheds();
      if (list.some(s => s.days.some(isNaN))) { toast("Typ de uren als 7u36 of 7:36"); return; }
      const base = scheduleFor(from);
      list.push({ from, days: base.days.slice() });
      await saveCfg({ ...cfg(), schedules: list }); state.settingsMsg = "Nieuw rooster toegevoegd. Pas de uren aan en bewaar."; render();
    };
    sf.querySelectorAll("[data-del-sched]").forEach(b => b.onclick = async () => {
      const n = +b.dataset.delSched; const list = readScheds().filter((_, k) => k !== n);
      await saveCfg({ ...cfg(), schedules: list.some(s => s.days.some(isNaN)) ? scheds.filter((_, k) => k !== n) : list }); state.settingsMsg = "Rooster verwijderd"; render();
    });
    $("#baseForm").onsubmit = async e => {
      e.preventDefault(); const f = e.target.elements;
      const bal = f.startBalance.value.trim() ? parseDur(f.startBalance.value) : 0;
      const after = parseDur(f.pauseAfter.value), full = parseDur(f.fullDay.value), pause = Math.round(+f.pauseDefault.value);
      const extra = parseDur(f.extraHolidayMin.value);
      if (!isDate(f.startDate.value)) { toast("Kies een startdatum"); return; }
      if (isNaN(bal)) { toast("Typ je saldo als +2u15 of −1u30"); f.startBalance.focus(); return; }
      if (isNaN(after) || isNaN(full) || full <= 0 || isNaN(pause) || pause < 0) { toast("Controleer de pauze en de lengte van een dag"); return; }
      if (isNaN(extra) || extra < 0) { toast("Typ de uren van een bijkomende feestdag als 6u52"); f.extraHolidayMin.focus(); return; }
      await saveCfg({ ...cfg(), startDate: f.startDate.value, startBalance: bal, pauseDefault: pause, pauseAfter: after, fullDay: full, extraHolidayMin: extra });
      state.settingsMsg = "Bewaard"; render();
    };
    $("#ryPrev").onclick = () => { state.year--; render(); };
    $("#ryNext").onclick = () => { state.year++; render(); };
    $("#useLegal").onclick = () => { $('[name="r_verlof"]').value = hm(legal); };
    $("#rightsForm").onsubmit = async e => {
      e.preventDefault(); const f = e.target.elements; const yr = {}; let bad = false;
      TYPES.filter(ty => ty.budget === true).forEach(ty => {
        const a = f["r_" + ty.code].value.trim(), b = f["b_" + ty.code].value.trim();
        const min = a ? parseDur(a) : 0, before = b ? parseDur(b) : 0;
        if (isNaN(min) || isNaN(before)) bad = true;
        if (min || before) yr[ty.code] = { min, before };
      });
      const vdv = f.vd_min.value.trim();
      if (vdv) { const n = parseDur(vdv); if (isNaN(n) || n < 0) bad = true; else yr.vervangdag = { min: n }; }
      if (bad) { toast("Typ de uren als 136u16 of 136:16"); return; }
      const rights = { ...(cfg().rights || {}) }; rights[Y] = yr;
      await saveCfg({ ...cfg(), rights }); state.settingsMsg = "Verlofrecht " + Y + " bewaard"; render();
    };
    $("#holForm").onsubmit = async e => {
      e.preventDefault(); const f = e.target.elements;
      if (!isDate(f.date.value) || !f.name.value.trim()) return;
      const raw = f.min.value.trim(), min = raw ? parseDur(raw) : null;
      if (raw && (isNaN(min) || min < 0)) { toast("Typ de uren als 6u52 of 7u36"); f.min.focus(); return; }
      const rec = { date: f.date.value, name: f.name.value.trim().slice(0, 60) };
      if (min != null) rec.min = min;
      await save("hol", "x" + uid(), rec);
      state.year = +f.date.value.slice(0, 4); state.settingsMsg = "Feestdag toegevoegd"; render();
    };
    viewEl.querySelectorAll("[data-hol-min]").forEach(inp => inp.onchange = async () => {
      const h = state.hol.find(x => x.id === inp.dataset.holMin); if (!h) return;
      const raw = inp.value.trim(), min = raw ? parseDur(raw) : null;
      if (raw && (isNaN(min) || min < 0)) { toast("Typ de uren als 6u52 of 7u36"); inp.focus(); return; }
      const rec = { date: h.date, name: h.name };
      if (min != null) rec.min = min;
      await save("hol", h.id, rec);
      inp.value = min != null ? hm(min) : "";
      toast(`${h.name} telt nu voor ${hm(holMin({ ...rec, id: h.id }))}`);
    });
    viewEl.querySelectorAll("[data-del-hol]").forEach(b => b.onclick = async () => {
      if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "?"; b.style.color = "var(--min)"; toast("Tik nogmaals om deze feestdag te verwijderen"); setTimeout(() => { b.dataset.armed = ""; b.textContent = "×"; b.style.color = ""; }, 3500); return; }
      await del("hol", b.dataset.delHol); state.settingsMsg = "Feestdag verwijderd"; render();
    });
  }

  function downloadBackup() {
    const labels = {}; TYPES.forEach(t => labels[t.code] = t.label);
    const obj = { app: "TimeAura", version: APP_VERSION, exported: new Date().toISOString(), instellingen: state.cfg || DEFAULT_CFG(), registraties: state.reg, afwezigheden: state.abs, feestdagen: state.hol, soorten: labels };
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], { type: "application/json" }));
    a.download = "timeaura-" + todayStr() + ".json"; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    try { localStorage.setItem(BACKUP_KEY, String(Date.now())); } catch (e) {}
    renderBanner();
  }

  function renderDataCard() {
    const el = $("#dataCard"); if (!el) return;
    el.innerHTML = `<div class="card-head"><h2>Je gegevens</h2></div>
      ${WEB && cloudOn() ? `<p class="explain">Je uren staan op dit toestel en in je eigen Google Drive (zie hierboven). Een extra back-up downloaden kan altijd.</p>`
      : WEB ? `<p class="explain">Je uren staan <b>alleen op dit toestel</b>, in deze app. Er gaat niets naar een server, ook niet naar je werkgever. Download daarom af en toe een back-up en bewaar die (bv. in je mail of op OneDrive). Met die back-up zet je je uren ook over naar een nieuwe gsm.</p>`
      : `<p class="explain">Alles staat in je eigen Google-spreadsheet <b>TimeAura</b>, in de tabbladen Registraties, Afwezigheden, Feestdagen en Instellingen. Zo blijft je tijdsregistratie jaren bewaard, ook los van deze app.</p>`}
      <div class="actions" style="margin-top:0">
        ${state.sheetUrl ? `<a class="btn small soft" href="${esc(state.sheetUrl)}" target="_blank" rel="noopener">Open je spreadsheet ↗</a>` : ""}
        <button type="button" class="btn small" id="exportBtn">Download back-up (.json)</button>
      </div>
      <div class="field" style="margin-top:16px">
        <span>Back-up terugzetten</span>
        <p class="explain" style="margin:0">Dit vervangt alles wat nu in ${WEB ? "de app" : "je spreadsheet"} staat.</p>
        <div class="actions" style="margin-top:4px"><input type="file" id="importFile" accept=".json,application/json" class="input" style="flex:1 1 200px;width:auto"><button type="button" class="btn small primary" id="importBtn">Terugzetten</button></div>
      </div>
      <p class="version">TimeAura-versie ${APP_VERSION}${WEB ? ` · <a class="link" href="privacy.html" target="_blank" rel="noopener">Privacy</a>` : ""}</p>`;
    $("#exportBtn").onclick = downloadBackup;
    const btn = $("#importBtn");
    btn.onclick = async () => {
      const file = $("#importFile").files[0];
      if (!file) { toast("Kies eerst een back-upbestand"); return; }
      if (!btn.dataset.armed) { btn.dataset.armed = "1"; btn.textContent = "Tik nogmaals: vervangt alles"; setTimeout(() => { btn.dataset.armed = ""; btn.textContent = "Terugzetten"; }, 4000); return; }
      btn.disabled = true; btn.textContent = "Bezig…";
      try {
        const obj = JSON.parse(await file.text());
        if (!obj || obj.app !== "TimeAura") throw new Error("Dit is geen TimeAura-back-up.");
        await state.db.importAll(obj);
        toast("Back-up teruggezet"); render();
      } catch (e) { toast(String((e && e.message) || e).replace(/^Error:\s*/, "")); btn.disabled = false; btn.textContent = "Terugzetten"; }
    };
  }

  /* ---------- Sheet: day, work time, absence ---------- */
  const sheetEl = $("#sheet"), sheetBody = $("#sheetBody");
  let sheetMode = null, lastFocus = null;
  function showSheet(html, mode) {
    sheetMode = mode; sheetBody.innerHTML = html;
    if (sheetEl.hidden) { lastFocus = document.activeElement; sheetEl.hidden = false; document.body.style.overflow = "hidden"; }
    sheetBody.scrollTop = 0;
    const f = sheetBody.querySelector("[data-focus]") || sheetBody.querySelector("h2");
    if (f) { if (f.tagName === "H2") f.tabIndex = -1; setTimeout(() => f.focus(), 30); }
  }
  function closeSheet() {
    sheetEl.hidden = true; sheetMode = null; document.body.style.overflow = "";
    if (lastFocus && lastFocus.focus && lastFocus.isConnected) lastFocus.focus();
  }
  const sheetHead = (eyebrow, title, extra) => `<div class="sheet-head"><div><span class="eyebrow">${eyebrow}</span><h2 id="sheetTitle">${esc(title)}</h2></div><div class="nav">${extra || ""}<button type="button" class="icon-btn" data-close aria-label="Sluiten">×</button></div></div>`;

  function openDay(date) {
    const i = dayInfo(date), t = todayStr();
    // Keep the week behind the window in step when you browse days with ‹ ›.
    if (state.view === "week" && mondayOf(date) !== state.weekOf) { state.weekOf = mondayOf(date); render(); }
    showSheet(`${sheetHead(date === t ? "Vandaag" : "Dag", fmtDate(date), `<button type="button" class="icon-btn" data-goto-day="${addDays(date, -1)}" aria-label="Vorige dag">‹</button><button type="button" class="icon-btn" data-goto-day="${addDays(date, 1)}" aria-label="Volgende dag">›</button>`)}
      <div class="day-sum">
        <button type="button" class="plan-btn ${overrideOf(date) !== null ? "changed" : ""}" data-plan="${date}" aria-label="Werktijd van deze dag aanpassen"><b class="num">${hm(i.target)}</b><small>moest ✎</small></button>
        <div><b class="num">${hm(i.worked)}</b><small>gewerkt</small></div>
        <div><b class="num">${hm(i.credit)}</b><small>afwezig</small></div>
        <div><b class="num" style="color:var(--${i.diff > 0 ? "plus" : i.diff < 0 ? "min" : "muted"})">${hm(i.diff, true)}</b><small>verschil</small></div>
      </div>
      ${overrideOf(date) !== null ? `<p class="explain">Werktijd voor deze dag aangepast: <b>${hm(plannedMin(date))}</b> in plaats van ${hm(baseMin(date))} volgens je rooster.</p>` : ""}
      ${i.hol && i.planned ? `<p class="explain">${esc(i.hol.name)} telt voor ${hm(holMin(i.hol))}. ${i.holCredit < i.planned ? `Je rooster heeft ${hm(i.planned)}, dus ${hm(i.planned - i.holCredit)} vul je zelf aan met werk of verlof.` : `Je hoeft je ${hm(i.planned)} niet te werken.`}</p>` : ""}
      <div class="items">${dayItems(i) || `<p class="explain" style="margin:8px 0">Nog niets geregistreerd voor deze dag.</p>`}</div>
      <div class="actions">
        ${i.planned && !i.abs.some(a => a.type === "thuiswerk") ? `<button type="button" class="btn primary" data-home="${date}">⌂ Thuiswerkdag</button>` : ""}
        <button type="button" class="btn soft" data-add-reg data-date="${date}" data-focus>+ Werktijd</button>
        <button type="button" class="btn soft" data-add-abs data-date="${date}">+ Afwezigheid</button>
      </div>`, { kind: "day", date });
  }

  // Change what one day asks, or swap it with another day: one of the same week, or any date
  // picked on the calendar (opts.swapWith) when the half day moves to a later week.
  function openPlan(date, how) {
    const base = baseMin(date), cur = plannedMin(date), changed = overrideOf(date) !== null;
    const mon = mondayOf(date), others = [], swapWith = how && how.swapWith && how.swapWith !== date ? how.swapWith : null;
    for (let k = 0; k < 7; k++) { const d = addDays(mon, k); if (d !== date && (k < 5 || plannedMin(d))) others.push(d); }
    if (swapWith && !others.includes(swapWith)) others.push(swapWith);
    const chipDay = d => mondayOf(d) === mon ? `${DSHORT[dow(d)]} ${parseD(d).getDate()}` : `${DSHORT[dow(d)]} ${fmtShort(d)}`;
    const opts = [...new Set([cfg().fullDay, ...cfg().schedules.flatMap(s => s.days), 0].filter(x => x !== undefined))].sort((a, b) => b - a);
    showSheet(`${sheetHead("Werktijd van deze dag", fmtDate(date), `<button type="button" class="btn small ghost" data-back-day="${date}">‹ Dag</button>`)}
      <form id="planForm" class="stack" novalidate>
        <p class="explain" style="margin:0">Volgens je rooster moet je op ${DAYS[dow(date)]} <b>${hm(base)}</b> werken.${changed ? ` Voor deze dag staat nu <b>${hm(cur)}</b>.` : ""}</p>
        <div class="field"><span>Werk je hier langer? Kies waar je halve dag naartoe gaat</span>
          <div class="chips">${others.map(d => `<label class="chip"><input type="radio" name="swap" value="${d}" ${d === swapWith ? "checked" : ""}><span>${chipDay(d)} · ${hm(plannedMin(d))}</span></label>`).join("")}
            <button type="button" class="btn small soft" data-swap-cal="${date}">📅 Andere datum kiezen…</button></div>
        </div>
        <label class="field"><span>Of vul zelf in hoeveel je deze dag moet werken</span>
          <input class="input num" name="min" value="${hm(cur)}" data-focus>
          <span class="quick-chips">${opts.map(m => `<button type="button" data-plan-min="${m}">${m ? hm(m) : "vrij"}</button>`).join("")}</span>
        </label>
        <div class="preview" id="planPreview"></div>
        <p class="form-error" id="planErr" hidden></p>
        <div class="form-actions">
          ${changed ? `<button type="button" class="btn ghost" id="planReset">Terug naar rooster (${hm(base)})</button>` : "<span></span>"}
          <button class="btn primary">Bewaren</button>
        </div>
      </form>`, { kind: "plan", date });
    const f = $("#planForm");
    const plan = () => {
      // Returns { date: minutes } for every day that changes.
      const sw = f.querySelector('input[name="swap"]:checked');
      // Moving your half day: this day becomes a full day and the other day gets that many hours
      // less (it can go down to vrij, e.g. a day that was already a half day by an earlier move).
      // When this day is already full, the two days swap their hours.
      if (sw) {
        const o = plannedMin(sw.value), full = cfg().fullDay;
        if (cur < full) { const mv = Math.min(full - cur, o); return { [date]: cur + mv, [sw.value]: o - mv }; }
        return { [date]: o, [sw.value]: cur };
      }
      const m = parseDur(f.elements.min.value);
      return isNaN(m) || m < 0 ? null : { [date]: m };
    };
    const upd = () => {
      const p = plan(), pr = $("#planPreview");
      if (!p) { pr.textContent = "Typ de uren als 7u36 of 3:48."; return; }
      const weekOf = m => Array.from({ length: 7 }, (_, k) => addDays(m, k));
      const mons = [...new Set(Object.keys(p).map(mondayOf))].sort();
      const lines = mons.map(m => {
        const week = weekOf(m), was = sum(week, plannedMin), will = sum(week, d => d in p ? p[d] : plannedMin(d));
        const label = mons.length > 1 ? `De week van ${fmtShort(m)}` : "Je week";
        return was === will ? `${label} blijft ${hm(will)}.` : `${label} wordt ${hm(will)} in plaats van ${hm(was)}.`;
      });
      if (mons.length > 1) lines.push("Samen blijft het gelijk: je verplaatst alleen uren.");
      pr.innerHTML = Object.keys(p).sort().map(d => `${DSHORT[dow(d)]} ${fmtShort(d)}: <b>${p[d] ? hm(p[d]) : "vrij"}</b>${p[d] === baseMin(d) ? " (zoals je rooster)" : ""}`).join("<br>")
        + `<br><span class="muted">${lines.join("<br>")}</span>`;
    };
    f.querySelectorAll("[data-plan-min]").forEach(b => b.onclick = () => { f.elements.min.value = hm(+b.dataset.planMin); f.querySelectorAll('input[name="swap"]').forEach(r => r.checked = false); upd(); });
    f.elements.min.addEventListener("input", () => { f.querySelectorAll('input[name="swap"]').forEach(r => r.checked = false); upd(); });
    f.addEventListener("change", upd); upd();
    f.onsubmit = async e => {
      e.preventDefault(); const p = plan();
      if (!p) { const err = $("#planErr"); err.textContent = "Typ het aantal uren, bijvoorbeeld 7u36."; err.hidden = false; return; }
      await applyPlan(p); toast("Werktijd aangepast"); openDay(date);
    };
    const r = $("#planReset");
    if (r) r.onclick = async () => { await applyPlan({ [date]: base }); toast("Terug naar je rooster"); openDay(date); };
  }
  async function applyPlan(p) {
    const o = Object.assign({}, cfg().dayOverrides || {});
    for (const d of Object.keys(p)) {
      const before = plannedMin(d), after = p[d];
      if (after === baseMin(d)) delete o[d]; else o[d] = after;
      // A full-day absence (verlof, thuiswerk…) follows the day's new hours.
      if (before !== after && after > 0) for (const a of (idx.abs.get(d) || [])) if (a.min === before) {
        const { id, ...rest } = a; await save("abs", id, { ...rest, min: after });
      }
    }
    await saveCfg({ ...cfg(), dayOverrides: o });
  }

  // Month calendar: pick any day, then the day window opens so you can register right away.
  // With swapFor it picks the day to swap that day's hours with (moving a half day to later).
  function openCal(anyDate, swapFor) {
    const t = todayStr(), mk = anyDate.slice(0, 7), first = mk + "-01";
    const start = mondayOf(first), wk = state.view === "week" ? state.weekOf : null;
    const prev = addDays(first, -1).slice(0, 7) + "-01", next = addDays(first, 32).slice(0, 7) + "-01";
    const end = addDays(mondayOf(addDays(next, -1)), 7); // whole weeks up to the month's last day
    const cells = [];
    for (let d = start; d < end; d = addDays(d, 1)) {
      const i = dayInfo(d), dots = [];
      if (i.hol) dots.push("hol");
      if (i.regs.length || i.home) dots.push("work");
      if (i.abs.some(a => a.type !== "thuiswerk")) dots.push("abs");
      if (!dots.length && i.target && d < t && d >= cfg().startDate) dots.push("miss");
      const moved = overrideOf(d) !== null;
      const cls = ["cal-day", d.slice(0, 7) !== mk ? "out" : "", !i.planned ? "off" : "", d === t ? "today" : "", wk && !swapFor && d >= wk && d < addDays(wk, 7) ? "wk" : "", moved ? "moved" : "", d === swapFor ? "src" : ""].filter(Boolean).join(" ");
      const pick = swapFor ? (d === swapFor ? "disabled" : `data-swap-pick="${d}" data-swap-for="${swapFor}"`) : `data-cal-pick="${d}"`;
      const tip = moved ? ` · werktijd ${hm(i.planned)} in plaats van ${hm(baseMin(d))}` : "";
      cells.push(`<button type="button" class="${cls}" ${pick} aria-label="${fmtDate(d)}${tip}" title="${fmtDate(d)}${tip}">${parseD(d).getDate()}${moved ? `<small class="mv">${hm(i.planned)}</small>` : ""}<span class="dots">${dots.map(x => `<i class="${x === "work" ? "" : x}"></i>`).join("")}</span></button>`);
    }
    const nav = `<button type="button" class="icon-btn" data-cal="${prev}" aria-label="Vorige maand">‹</button><button type="button" class="icon-btn" data-cal="${next}" aria-label="Volgende maand">›</button>`;
    const head = swapFor
      ? sheetHead("Waar gaat je halve dag naartoe?", MONTHS[+mk.slice(5) - 1] + " " + mk.slice(0, 4), `<button type="button" class="btn small ghost" data-plan="${swapFor}">‹ Terug</button>${nav}`)
        + `<p class="explain">Tik op de dag die in de plaats van <b>${esc(fmtDate(swapFor))}</b> korter wordt. De uren die je op ${esc(fmtShort(swapFor))} extra werkt, gaan van die dag af.</p>`
      : sheetHead("Kies een dag", MONTHS[+mk.slice(5) - 1] + " " + mk.slice(0, 4), nav);
    showSheet(`${head}
      <div class="cal-grid">${["ma", "di", "wo", "do", "vr", "za", "zo"].map(x => `<span class="dh">${x}</span>`).join("")}${cells.join("")}</div>
      <div class="cal-legend"><span><i style="background:var(--peach)"></i>gewerkt</span><span><i style="background:var(--mauve)"></i>afwezig</span><span><i style="background:var(--plus)"></i>feestdag</span><span><i style="background:var(--min);opacity:.6"></i>niets ingevuld</span><span><i class="mv-key"></i>werktijd verplaatst</span></div>
      <form class="cal-jump" id="calJump">
        <label class="field"><span>Of kies een datum</span><input class="input" type="date" name="d" value="${anyDate}" required></label>
        <button class="btn soft" type="submit">${swapFor ? "Kies" : "Ga"}</button>
        ${mk !== t.slice(0, 7) ? `<button class="btn ghost" type="button" data-cal="${t}">Vandaag</button>` : ""}
      </form>`, { kind: "cal", date: anyDate, swapFor: swapFor || null });
    $("#calJump").onsubmit = e => {
      e.preventDefault(); const v = e.target.d.value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
      if (swapFor) { if (v !== swapFor) openPlan(swapFor, { swapWith: v }); } else pickDay(v);
    };
  }
  function pickDay(d) {
    state.weekOf = mondayOf(d);
    if (state.view !== "week") route("week"); else render();
    openDay(d);
  }

  function openReg(date, id) {
    const r = id ? state.reg.find(x => x.id === id) : null;
    if (id && !r) return;
    const back = sheetMode && sheetMode.kind === "day";
    const others = (idx.reg.get(date) || []).filter(x => !r || x.id !== r.id);
    const c = cfg();
    const def = r || { date, start: others.length ? "" : "08:30", end: "", pause: others.length ? 0 : (plannedMin(date) > c.pauseAfter ? c.pauseDefault : 0), note: "" };
    showSheet(`${sheetHead(r ? "Werktijd aanpassen" : "Werktijd toevoegen", fmtDate(date), back ? `<button type="button" class="btn small ghost" data-back-day="${date}">‹ Dag</button>` : "")}
      <form id="regForm" class="stack" novalidate>
        <div class="form-grid">
          <label class="field"><span>Datum</span><input class="input" type="date" name="date" value="${esc(def.date)}" required></label>
          <label class="field"><span>Begin</span><input class="input num" type="time" name="start" value="${esc(def.start)}" required data-focus></label>
          <label class="field"><span>Einde</span><input class="input num" type="time" name="end" value="${esc(def.end)}"></label>
        </div>
        <label class="field"><span>Pauze (minuten)</span>
          <input class="input num" type="number" name="pause" min="0" max="600" value="${def.pause || 0}">
          <span class="quick-chips">${[0, 15, 30, 45, 60].map(m => `<button type="button" data-pause="${m}">${m} min</button>`).join("")}</span>
        </label>
        <label class="field"><span>Notitie</span><input class="input" name="note" value="${esc(def.note)}" maxlength="200" placeholder="bv. overleg, avondvergadering"></label>
        <div class="preview" id="regPreview"></div>
        <p class="form-error" id="regErr" hidden></p>
        <div class="form-actions">
          ${r ? `<button type="button" class="btn danger" id="regDel">Verwijderen</button>` : "<span></span>"}
          <button class="btn primary">Bewaren</button>
        </div>
      </form>`, { kind: "reg", date, id, back });
    const f = $("#regForm");
    const upd = () => {
      const el = f.elements, s = toMin(el.start.value), e = toMin(el.end.value), p = Math.max(0, +el.pause.value || 0);
      const pr = $("#regPreview");
      if (s == null) { pr.textContent = "Vul je beginuur in."; return; }
      if (e == null) { pr.innerHTML = "Zonder einduur blijf je <b>ingetikt</b>. Je kan later uittikken op de startpagina."; return; }
      const span = regSpan({ start: el.start.value, end: el.end.value });
      const w = Math.max(0, span - p), pl = plannedMin(el.date.value) || 0;
      pr.innerHTML = `Aanwezig ${hm(span)} − pauze ${p} min = <b>${hm(w)}</b> gewerkt${e < s ? " (tot na middernacht)" : ""}${pl && !others.length ? ` · rooster ${hm(pl)}, verschil <b>${hm(w - pl, true)}</b>` : ""}`;
    };
    f.addEventListener("input", upd); upd();
    f.querySelectorAll("[data-pause]").forEach(b => b.onclick = () => { f.elements.pause.value = b.dataset.pause; upd(); });
    f.onsubmit = async e => {
      e.preventDefault(); const el = f.elements, err = $("#regErr");
      const showErr = m => { err.textContent = m; err.hidden = false; };
      if (!isDate(el.date.value)) return showErr("Kies een datum.");
      if (toMin(el.start.value) == null) return showErr("Vul je beginuur in.");
      if (!el.end.value) { const run = runningReg(); if (run && (!r || run.id !== r.id)) return showErr(`Je bent al ingetikt op ${fmtDate(run.date)}. Vul eerst daar een einduur in.`); }
      const rec = { date: el.date.value, start: el.start.value, end: el.end.value || "", pause: Math.max(0, Math.round(+el.pause.value || 0)), note: el.note.value.trim().slice(0, 200), created: r ? r.created || new Date().toISOString() : new Date().toISOString() };
      await save("reg", r ? r.id : "r" + uid(), rec);
      toast(r ? "Aangepast" : "Werktijd bewaard");
      if (back) openDay(rec.date); else closeSheet();
    };
    const d = $("#regDel");
    if (d) d.onclick = async () => {
      if (!d.dataset.armed) { d.dataset.armed = "1"; d.textContent = "Tik nogmaals om te verwijderen"; setTimeout(() => { d.dataset.armed = ""; d.textContent = "Verwijderen"; }, 3500); return; }
      await del("reg", r.id); toast("Verwijderd"); if (back) openDay(date); else closeSheet();
    };
  }

  // Holidays on a day you don't work: their hours are taken later as vervangdag(en), each linked to the holiday.
  const freeHols = Y => state.hol.filter(h => String(h.date).slice(0, 4) === String(Y) && plannedMin(h.date) === 0).sort((a, b) => a.date < b.date ? -1 : 1);
  const vdFor = (holId, exceptId) => state.abs.filter(a => a.type === "vervangdag" && a.hol === holId && a.id !== exceptId);
  const vdLeft = (h, exceptId) => holMin(h) - sum(vdFor(h.id, exceptId), a => a.min || 0);

  function openAbs(date, id, opts) {
    opts = opts || {};
    const a = id ? state.abs.find(x => x.id === id) : null;
    if (id && !a) return;
    const back = sheetMode && sheetMode.kind === "day";
    const pl = plannedMin(date);
    let mode = "full";
    if (a) mode = a.min === pl ? "full" : a.min === Math.round(pl / 2) ? "half" : "custom";
    else if (!pl) mode = "custom";
    const type = a ? a.type : opts.hol ? "vervangdag" : "verlof";
    // Which holiday a vervangdag replaces: the one asked for, the saved one, or the first that still has hours.
    const hy = +date.slice(0, 4), holChoices = [...freeHols(hy - 1), ...freeHols(hy)];
    const holId = a ? a.hol || "" : opts.hol || (holChoices.find(h => vdLeft(h) > 0) || {}).id || "";
    const preHol = !a && opts.hol && state.hol.find(h => h.id === opts.hol);
    let customVal = a && mode === "custom" ? hm(a.min) : "";
    if (preHol) { const left = vdLeft(preHol); if (left > 0 && left < pl) { mode = "custom"; customVal = hm(left); } }
    showSheet(`${sheetHead(a ? "Afwezigheid aanpassen" : "Afwezigheid toevoegen", fmtDate(date), back ? `<button type="button" class="btn small ghost" data-back-day="${date}">‹ Dag</button>` : "")}
      <form id="absForm" class="stack" novalidate>
        <div class="field"><span>Soort</span><div class="chips">${TYPES.map(t => `<label class="chip"><input type="radio" name="type" value="${t.code}" ${t.code === type ? "checked" : ""}><span>${esc(t.label)}</span></label>`).join("")}</div></div>
        <label class="field" id="holField"><span>In de plaats van welke feestdag?</span>
          <select class="input" name="hol">
            <option value="">Geen bepaalde feestdag</option>
            ${holChoices.concat(holId && !holChoices.some(h => h.id === holId) ? state.hol.filter(h => h.id === holId) : []).map(h => `<option value="${esc(h.id)}" ${h.id === holId ? "selected" : ""}>${esc(h.name)} (${DSHORT[dow(h.date)]} ${fmtShort(h.date)} ${h.date.slice(0, 4)}) · nog ${hm(Math.max(0, vdLeft(h, a && a.id)))} van ${hm(holMin(h))}</option>`).join("")}
          </select>
        </label>
        <div class="form-grid">
          <label class="field"><span>${a || preHol ? "Datum" : "Van"}</span><input class="input" type="date" name="date" value="${esc(date)}" required ${preHol ? "data-focus" : ""}></label>
          ${a || preHol ? "" : `<label class="field"><span>Tot en met (optioneel)</span><input class="input" type="date" name="until" value=""></label>`}
        </div>
        <div class="field"><span>Hoe lang</span><div class="chips">
          <label class="chip"><input type="radio" name="mode" value="full" ${mode === "full" ? "checked" : ""}><span>Hele dag</span></label>
          <label class="chip"><input type="radio" name="mode" value="half" ${mode === "half" ? "checked" : ""}><span>Halve dag</span></label>
          <label class="chip"><input type="radio" name="mode" value="custom" ${mode === "custom" ? "checked" : ""}><span>Eigen uren</span></label>
        </div></div>
        <label class="field" id="customField"><span>Uren</span><input class="input num" name="custom" value="${customVal}" placeholder="bv. 2u30"></label>
        <label class="field"><span>Notitie</span><input class="input" name="note" value="${esc(a ? a.note : "")}" maxlength="200"></label>
        <div class="preview" id="absPreview"></div>
        <p class="form-error" id="absErr" hidden></p>
        <div class="form-actions">
          ${a ? `<button type="button" class="btn danger" id="absDel">Verwijderen</button>` : "<span></span>"}
          <button class="btn primary">Bewaren</button>
        </div>
      </form>`, { kind: "abs", date, id, back });
    const f = $("#absForm");
    const days = () => {
      const el = f.elements, from = el.date.value, until = el.until && isDate(el.until.value) ? el.until.value : from;
      if (!isDate(from)) return [];
      if (until === from || a) return [from];
      const out = [];
      for (let d = from; d <= until && out.length < 370; d = addDays(d, 1)) if (plannedMin(d) > 0 && !holidayOn(d)) out.push(d);
      return out;
    };
    const minFor = d => {
      const el = f.elements, m = el.mode.value, p = plannedMin(d);
      if (m === "full") return p; if (m === "half") return Math.round(p / 2);
      return parseDur(el.custom.value);
    };
    const upd = () => {
      const el = f.elements; $("#customField").hidden = el.mode.value !== "custom";
      $("#holField").hidden = el.type.value !== "vervangdag";
      const ty = typeOf(el.type.value), list = days(), pr = $("#absPreview");
      if (!list.length) { pr.textContent = "In die periode sta je geen enkele dag ingeroosterd."; return; }
      const mins = list.map(minFor);
      if (mins.some(isNaN)) { pr.textContent = "Typ de uren als 2u30 of 2:30."; return; }
      const tot = sum(mins, x => x);
      const what = list.length > 1 ? `${list.length} werkdagen, samen <b>${hm(tot)}</b>` : `<b>${hm(tot)}</b>`;
      let eff;
      if (ty.code === "recup") eff = `Je plus/min-saldo daalt met ${hm(tot)}.`;
      else if (ty.code === "vervangdag" && el.hol.value && state.hol.find(h => h.id === el.hol.value)) {
        const h = state.hol.find(x => x.id === el.hol.value), left = vdLeft(h, a && a.id) - tot;
        eff = `In de plaats van ${esc(h.name)} (${hm(holMin(h))}). ${left > 0 ? `Daarna blijft er nog ${hm(left)} van over.` : left < 0 ? `Dat is ${hm(-left)} meer dan die feestdag waard is: die uren gaan van je andere vervanguren af.` : "Daarmee is die feestdag volledig opgenomen."}${list.length === 1 && plannedMin(list[0]) > tot ? ` Je rooster die dag is ${hm(plannedMin(list[0]))}: de overige ${hm(plannedMin(list[0]) - tot)} werk je of neem je anders op.` : ""}`;
      }
      else if (ty.budget) { const s = leaveStats(+list[0].slice(0, 4), ty.code); eff = s.right ? `Daarna heb je nog ${hm(s.left - (a ? tot - a.min : tot))} ${ty.label.toLowerCase()} over.` : "Telt als gewerkt."; }
      else eff = "Telt als gewerkt, je saldo blijft gelijk.";
      pr.innerHTML = `${what}. ${eff}${list.length === 1 && el.mode.value !== "custom" && !plannedMin(list[0]) ? " Op deze dag sta je niet ingeroosterd: kies Eigen uren." : ""}`;
    };
    f.addEventListener("input", upd); f.addEventListener("change", upd); upd();
    f.onsubmit = async e => {
      e.preventDefault(); const el = f.elements, err = $("#absErr");
      const showErr = m => { err.textContent = m; err.hidden = false; };
      const list = days();
      if (!list.length) return showErr("Kies een dag waarop je ingeroosterd bent, of kies Eigen uren.");
      const mins = list.map(minFor);
      if (mins.some(x => isNaN(x) || x <= 0)) return showErr(el.mode.value === "custom" ? "Typ het aantal uren, bijvoorbeeld 2u30." : "Op deze dag sta je niet ingeroosterd. Kies Eigen uren.");
      const note = el.note.value.trim().slice(0, 200), type = el.type.value;
      const hol = type === "vervangdag" ? el.hol.value : "";
      for (let k = 0; k < list.length; k++) {
        const body = { date: list[k], type, min: mins[k], note, created: a ? a.created || new Date().toISOString() : new Date().toISOString() };
        if (hol) body.hol = hol;
        await save("abs", a ? a.id : "a" + uid(), body);
      }
      toast(list.length > 1 ? list.length + " dagen bewaard" : "Afwezigheid bewaard");
      if (back) openDay(list[0]); else closeSheet();
    };
    const d = $("#absDel");
    if (d) d.onclick = async () => {
      if (!d.dataset.armed) { d.dataset.armed = "1"; d.textContent = "Tik nogmaals om te verwijderen"; setTimeout(() => { d.dataset.armed = ""; d.textContent = "Verwijderen"; }, 3500); return; }
      await del("abs", a.id); toast("Verwijderd"); if (back) openDay(date); else closeSheet();
    };
  }

  // A home-working day: no punching, it simply counts as the hours of that day's schedule.
  async function homeDay(date) {
    const p = plannedMin(date), i = dayInfo(date);
    if (!p) { toast("Op deze dag sta je niet ingeroosterd"); return; }
    if (i.abs.some(a => a.type === "thuiswerk")) { toast("Deze dag staat al als thuiswerk"); return; }
    await save("abs", "a" + uid(), { date, type: "thuiswerk", min: p, note: "", created: new Date().toISOString() });
    toast(`Thuiswerkdag: telt voor ${hm(p)}`);
    if (sheetMode && sheetMode.kind === "day") openDay(date);
  }

  /* ---------- Clicks & routing ---------- */
  document.addEventListener("click", e => {
    const el = e.target.closest && e.target.closest("[data-close],[data-back-day],[data-goto-day],[data-plan],[data-cal],[data-cal-pick],[data-swap-cal],[data-swap-pick],[data-vd-hol],[data-home],[data-add-reg],[data-add-abs],[data-reg],[data-abs],[data-day],a[href^='#']");
    if (el && el.dataset.home) return homeDay(el.dataset.home);
    const bk = e.target.closest && e.target.closest("[data-backup]"); if (bk) return downloadBackup();
    const cs = e.target.closest && e.target.closest("[data-cloud-sync]"); if (cs) return cloudSync(true);
    if (!el) return;
    if (el.matches("a[href^='#']")) { e.preventDefault(); if (!sheetEl.hidden) closeSheet(); route(el.getAttribute("href").slice(1)); return; }
    if (el.hasAttribute("data-close")) return closeSheet();
    if (el.dataset.backDay) return openDay(el.dataset.backDay);
    if (el.dataset.gotoDay) return openDay(el.dataset.gotoDay);
    if (el.dataset.plan) return openPlan(el.dataset.plan);
    if (el.dataset.cal) return openCal(el.dataset.cal, sheetMode && sheetMode.kind === "cal" ? sheetMode.swapFor : null);
    if (el.dataset.swapCal) return openCal(el.dataset.swapCal, el.dataset.swapCal);
    if (el.dataset.swapPick) return openPlan(el.dataset.swapFor, { swapWith: el.dataset.swapPick });
    if (el.dataset.calPick) return pickDay(el.dataset.calPick);
    if (el.dataset.vdHol) return openAbs(el.dataset.date || todayStr(), null, { hol: el.dataset.vdHol });
    if (el.hasAttribute("data-add-reg")) return openReg(el.dataset.date || todayStr(), null);
    if (el.hasAttribute("data-add-abs")) return openAbs(el.dataset.date || todayStr(), null);
    if (el.dataset.reg) return openReg(el.dataset.date, el.dataset.reg);
    if (el.dataset.abs) return openAbs(el.dataset.date, el.dataset.abs);
    if (el.dataset.day) return openDay(el.dataset.day);
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheetEl.hidden) closeSheet(); });

  function render() {
    document.querySelectorAll("[data-view]").forEach(a => { if (a.dataset.view === state.view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    renderBanner();
    if (!state.loaded) return;
    if (!state.cfg) { renderSetup(); return; }
    if (state.view === "week") renderWeek();
    else if (state.view === "verlof") renderLeave();
    else if (state.view === "tellers") renderCounters();
    else if (state.view === "instellingen") renderSettings();
    else renderToday();
  }
  // Inside Google's frame the address bar is not ours, so views switch in the page itself.
  function route(name) {
    state.view = ["vandaag", "week", "verlof", "tellers", "instellingen"].includes(name) ? name : "vandaag";
    render(); window.scrollTo(0, 0);
  }

  let toastTimer = null;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200); }

  /* ---------- Saving ---------- */
  async function save(coll, id, body) { state.db.set(coll, id, body); }
  async function del(coll, id) { state.db.del(coll, id); }
  // fresh = made on the start screen of a new device. When that device later connects to Google
  // Drive, the settings already in Drive win over these defaults (see mergeRemote).
  async function saveCfg(c, fresh) {
    const body = { ...c, updated: new Date().toISOString() };
    // Default values that were never stored stay out, so they cannot count as a change (see mergeRemote).
    const def = DEFAULT_CFG(), cur = state.cfg || {};
    if (!fresh) Object.keys(body).forEach(k => { if (!(k in cur) && k in def && JSON.stringify(body[k]) === JSON.stringify(def[k])) delete body[k]; });
    if (fresh && WEB) body.fresh = true; else delete body.fresh;
    state.db.set("config", "main", body);

  viewEl.addEventListener("input", () => { if (state.view === "instellingen") state.settingsDirty = true; });
  function onData(snap) {
    state.reg = snap.reg; state.abs = snap.abs; state.hol = snap.hol; state.cfg = snap.cfg; state.loaded = true;
    reindex();
    // Settings hold half-typed values; they re-render only after their own save,
    // or when the settings themselves changed (e.g. arrived from another device).
    // While you are typing there, nothing is redrawn under your fingers.
    const cfgStamp = JSON.stringify(snap.cfg || null);
    if (state.view !== "instellingen" || !viewEl.querySelector("#schedForm") || (cfgStamp !== state.cfgShown && !state.settingsDirty)) render();
    else renderBanner();
    if (sheetMode && sheetMode.kind === "day") openDay(sheetMode.date);
  }

  /* ---------- Start ---------- */
  if (WEB) {
    // Works offline, and asks the browser not to clear the data when the phone runs low on space.
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  }
  state.db = makeStore(onData, renderSync, onLocalChange);
  render();
  state.db.refresh().catch(e => {
    viewEl.innerHTML = `<div class="card" style="max-width:560px;margin:40px auto;text-align:center"><h2>Je spreadsheet is niet bereikbaar</h2><p class="explain">${esc((e && e.message) || "Controleer je internetverbinding.")}</p><button class="btn primary" onclick="location.reload()">Opnieuw proberen</button></div>`;
  });
  state.db.flush();
  if (CLIENT_ID) {
    // Load Google's sign-in script ahead, so a tap on "Synchroniseren" can open its window right away.
    if (navigator.onLine) loadGis().catch(() => {});
    setTimeout(() => { renderCloud(); cloudSync(false); }, 300);
    setInterval(() => { if (document.visibilityState === "visible" && tokenOk()) cloudSync(false); }, 5 * 60000);
    window.addEventListener("online", () => { if (tokenOk()) cloudSync(false); else renderCloud(); });
  }
  // Keep the live counters on "Vandaag" fresh, and pick up changes made elsewhere when you come back.
  setInterval(() => { if (state.loaded && state.view === "vandaag" && sheetEl.hidden && document.visibilityState === "visible") render(); }, 30000);
  let lastRefresh = Date.now();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (CLIENT_ID) { if (tokenOk()) cloudSync(false); else renderCloud(); }
    if (Date.now() - lastRefresh < 60000) return;
    lastRefresh = Date.now();
    state.db.refresh().then(() => { if (state.view === "instellingen") render(); }).catch(() => {});
  });
})();
</script>
</body>
</html>
