<style>
/* TimeAura: a soft, feminine time journal. Blush, peach and mauve, a flower-clock mark,
   a big round punch button on "Vandaag", and plain-language counters. */
:root {
  --bg: #FBF5F2; --surface: #FFFFFF; --surface-2: #F8EDE9; --ink: #3D2A33; --muted: #806B74; --faint: #BCA8AF; --line: #F1E2DD;
  --rose: #B95F7E; --rose-soft: #F8E3E9; --peach: #E39C86; --peach-soft: #FCEAE2; --mauve: #8C6FA6; --mauve-soft: #EFE8F6;
  --plus: #4F8A6B; --plus-soft: #E2F0E8; --min: #B4475B; --min-soft: #F8E0E4; --warn: #A16C1B; --warn-soft: #F8EBD3;
  --on-accent: #FFFFFF; --aura-1: #F9DCD6; --aura-2: #EBDDF3; --aura-3: #FCEBE1;
  --shadow: 0 1px 2px rgba(110, 50, 75, .05), 0 12px 32px rgba(110, 50, 75, .07);
  --f-display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --f-body: "Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --r-card: 24px; --r-ctl: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1418; --surface: #251B21; --surface-2: #30242B; --ink: #F5E9EE; --muted: #C0AAB4; --faint: #806C76; --line: #3B2C34;
    --rose: #EA9DB6; --rose-soft: #43272F; --peach: #F0B39F; --peach-soft: #3F2A24; --mauve: #C2A9E0; --mauve-soft: #30293F;
    --plus: #8BC6A6; --plus-soft: #1F3229; --min: #F08F9E; --min-soft: #432229; --warn: #E2B46C; --warn-soft: #3A2E1B;
    --on-accent: #2A1620; --aura-1: #4B2B37; --aura-2: #322845; --aura-3: #45302A; --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1418; --surface: #251B21; --surface-2: #30242B; --ink: #F5E9EE; --muted: #C0AAB4; --faint: #806C76; --line: #3B2C34;
  --rose: #EA9DB6; --rose-soft: #43272F; --peach: #F0B39F; --peach-soft: #3F2A24; --mauve: #C2A9E0; --mauve-soft: #30293F;
  --plus: #8BC6A6; --plus-soft: #1F3229; --min: #F08F9E; --min-soft: #432229; --warn: #E2B46C; --warn-soft: #3A2E1B;
  --on-accent: #2A1620; --aura-1: #4B2B37; --aura-2: #322845; --aura-3: #45302A; --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top-inner { display: flex; align-items: center; gap: 20px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); margin-right: auto; }
.brand-mark { width: 34px; height: 34px; flex: 0 0 auto; }
.brand-name { font-family: var(--f-display); font-size: 25px; font-weight: 400; letter-spacing: .01em; }
.brand-name em { font-style: italic; color: var(--rose); }
/* Sidebar (computer), like FinAura */
.side { position: fixed; left: 0; top: 0; bottom: 0; width: 236px; z-index: 25; display: flex; flex-direction: column; gap: 26px; padding: 22px 16px; background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; }
.side .brand { padding: 2px 8px; margin: 0; }
.side-nav { display: grid; gap: 4px; }
.side-nav a { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; color: var(--muted); text-decoration: none; font-weight: 500; }
.side-nav a svg { width: 20px; height: 20px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; }
.side-nav a:hover { background: var(--surface-2); color: var(--ink); }
.side-nav a[aria-current="page"] { background: var(--rose-soft); color: var(--ink); }
.side-nav a[aria-current="page"] svg { color: var(--rose); }
body { padding-left: 236px; }
header.top { display: none; }
.toast { margin-left: 118px; }
.bottom-nav { display: none; }
@media (max-width: 760px) {
  .side { display: none; }
  body { padding-left: 0; }
  header.top { display: block; }
  .toast { margin-left: 0; }
  .bottom-nav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; inset: auto 0 0; z-index: 30; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .bottom-nav a { display: grid; justify-items: center; gap: 2px; padding: 6px 0; text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 500; border-radius: 14px; }
  .bottom-nav svg { width: 22px; height: 22px; }
  .bottom-nav a[aria-current="page"] { color: var(--rose); background: var(--rose-soft); }
}

main { padding-block: 24px 120px; }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 18px; border-radius: var(--r-card); background: var(--mauve-soft); margin-bottom: 20px; }
.banner p { margin: 0; flex: 1 1 280px; }
.banner.warn { background: var(--warn-soft); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 10px 18px; border-radius: 999px; font-weight: 500; text-decoration: none; color: var(--ink); min-height: 44px; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--rose); border-color: var(--rose); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.soft { background: var(--rose-soft); border-color: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.danger { color: var(--min); border-color: var(--min-soft); background: var(--min-soft); }
.btn.small { min-height: 36px; padding: 6px 14px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); width: 38px; height: 38px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--muted); font-size: 18px; line-height: 1; }
.icon-btn:hover { color: var(--ink); background: var(--surface-2); }

/* Cards & grid */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; }
.card { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 22px 24px; min-width: 0; border: 1px solid var(--line); }
.span-12 { grid-column: span 12; } .span-7 { grid-column: span 7; } .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; }
.col { display: grid; gap: 20px; align-content: start; min-width: 0; }
@media (max-width: 900px) { .span-7, .span-5, .span-6 { grid-column: span 12; } }
@media (max-width: 520px) { .grid { gap: 14px; } .col { gap: 14px; } .card { padding: 18px 16px; border-radius: 20px; } }
.card h2 { font-family: var(--f-display); font-weight: 400; font-size: 21px; margin: 0; letter-spacing: -.005em; text-wrap: balance; }
.card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; margin-bottom: 14px; }
.card-head .sub { color: var(--muted); font-size: 13px; }
.eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: 11px; font-weight: 500; color: var(--muted); }
.page-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.page-head h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(26px, 4vw, 34px); margin: 0; letter-spacing: -.01em; }
.page-head h1 em { font-style: italic; color: var(--rose); }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper span { min-width: 150px; text-align: center; font-weight: 500; }
.cal-open { display: inline-flex; align-items: center; gap: 8px; min-width: 150px; justify-content: center; border: 1px solid transparent; background: transparent; color: var(--ink); font-weight: 500; padding: 8px 12px; border-radius: 999px; min-height: 38px; }
.cal-open svg { color: var(--rose); flex: 0 0 auto; }
.cal-open:hover { background: var(--surface-2); border-color: var(--line); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-grid .dh { text-align: center; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 4px 0; }
.cal-day { position: relative; border: 1px solid transparent; background: transparent; border-radius: 14px; min-height: 52px; padding: 6px 2px 14px; display: grid; justify-items: center; align-content: start; color: var(--ink); font-variant-numeric: tabular-nums; font-size: 15px; }
.cal-day:hover { background: var(--surface-2); }
.cal-day.off { color: var(--faint); }
.cal-day.out { opacity: .35; }
.cal-day.wk { background: color-mix(in srgb, var(--rose-soft) 45%, transparent); }
.cal-day.today { border-color: var(--rose); font-weight: 600; }
.cal-day .dots { position: absolute; bottom: 7px; left: 0; right: 0; display: flex; gap: 3px; justify-content: center; }
.cal-day .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--peach); }
.cal-day.moved { border: 1px dashed var(--rose); }
.cal-day.src { background: var(--rose-soft); }
.cal-day .mv { position: absolute; top: 25px; left: 0; right: 0; font-size: 10px; color: var(--rose); line-height: 1; }
.cal-legend .mv-key { border: 1px dashed var(--rose); background: transparent !important; border-radius: 3px; width: 9px; height: 9px; }
.cal-day .dots i.abs { background: var(--mauve); } .cal-day .dots i.hol { background: var(--plus); } .cal-day .dots i.miss { background: var(--min); opacity: .6; }
.cal-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
.cal-legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
.cal-jump { display: flex; gap: 8px; align-items: end; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.cal-jump .field { flex: 1 1 auto; margin: 0; }
.explain { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
.explain b { color: var(--ink); font-weight: 500; }

/* Today */
.today-card { position: relative; overflow: hidden; }
.today-card::before { content: ""; position: absolute; width: 380px; height: 380px; right: -150px; top: -170px; border-radius: 50%; background: radial-gradient(circle, var(--aura-3), transparent 70%); pointer-events: none; }
.today-card h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(26px, 4vw, 34px); margin: 2px 0 2px; text-transform: none; letter-spacing: -.01em; position: relative; }
.today-plan { margin: 0 0 18px; color: var(--muted); position: relative; }
.punch-wrap { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; position: relative; }
.punch { position: relative; width: 168px; height: 168px; border-radius: 50%; border: 0; color: var(--on-accent); display: grid; place-content: center; gap: 2px; text-align: center; background: radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--peach) 80%, white), var(--peach) 35%, var(--rose) 100%); box-shadow: 0 0 0 8px var(--rose-soft), 0 18px 40px color-mix(in srgb, var(--rose) 35%, transparent); transition: transform .15s ease; flex: 0 0 auto; }
.punch:hover { transform: scale(1.02); }
.punch:active { transform: scale(.98); }
.punch-label { font-family: var(--f-display); font-size: 24px; font-weight: 400; }
.punch-sub { font-size: 13px; opacity: .9; }
.punch.running { background: radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--mauve) 70%, white), var(--mauve) 45%, color-mix(in srgb, var(--mauve) 70%, var(--rose)) 100%); box-shadow: 0 0 0 8px var(--mauve-soft), 0 18px 40px color-mix(in srgb, var(--mauve) 35%, transparent); }
.punch.running::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid var(--mauve); opacity: .5; animation: halo 2.4s ease-out infinite; }
@keyframes halo { from { transform: scale(1); opacity: .5; } to { transform: scale(1.18); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .punch.running::after { animation: none; } }
.today-stats { display: grid; grid-template-columns: repeat(3, minmax(0, auto)); gap: 14px 26px; flex: 1 1 240px; }
.today-stats div { min-width: 0; }
.today-stats b { display: block; font-family: var(--f-display); font-weight: 300; font-size: 30px; line-height: 1.15; margin-top: 2px; }
@media (max-width: 520px) { .punch-wrap { justify-content: center; gap: 22px; } .today-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); text-align: center; } .today-stats b { font-size: 24px; } }
.progress { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 22px 0 6px; position: relative; }
.progress i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: linear-gradient(90deg, var(--peach), var(--rose)); }
.progress i.abs { background: var(--mauve); opacity: .55; }
.progress-legend { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); }
.items { display: grid; margin-top: 14px; }
.item { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 4px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%; }
.item:hover { background: var(--surface-2); }
.item:last-child { border-bottom: 0; }
.item > div { min-width: 0; }
.item .badge { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--peach-soft); color: var(--rose); font-size: 12px; font-weight: 600; }
.item .badge.abs { background: var(--mauve-soft); color: var(--mauve); }
.item .badge.hol { background: var(--plus-soft); color: var(--plus); }
.item .t1 { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .t2 { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .amt { font-weight: 500; white-space: nowrap; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

/* Saldo hero */
.hero { position: relative; overflow: hidden; background: linear-gradient(140deg, var(--aura-1), var(--aura-2)); border: 0; }
.hero::after { content: ""; position: absolute; width: 260px; height: 260px; right: -90px; bottom: -120px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--surface) 55%, transparent), transparent 70%); pointer-events: none; }
.hero > * { position: relative; z-index: 1; }
.hero-value { font-family: var(--f-display); font-size: clamp(40px, 6vw, 56px); font-weight: 300; line-height: 1.05; margin: 6px 0 8px; letter-spacing: -.01em; }
.hero-value.pos { color: var(--plus); } .hero-value.neg { color: var(--min); }
.hero-note { color: var(--muted); margin: 0 0 4px; font-size: 14px; }
.hero a { color: var(--rose); font-weight: 500; text-decoration: none; display: inline-block; margin-top: 10px; }

/* Week bars */
.wbars { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; align-items: end; }
.wbar { border: 0; background: transparent; padding: 4px 0; display: grid; justify-items: center; gap: 4px; border-radius: 14px; }
.wbar:hover { background: var(--surface-2); }
.wbar-track { width: 26px; height: 96px; border-radius: 999px; background: var(--surface-2); position: relative; overflow: hidden; }
.wbar-track i { position: absolute; inset: auto 0 0 0; border-radius: 999px; background: linear-gradient(0deg, var(--rose), var(--peach)); }
.wbar.future .wbar-track i { opacity: .5; }
.wbar.free .wbar-track { background: repeating-linear-gradient(45deg, var(--surface-2), var(--surface-2) 4px, transparent 4px, transparent 8px); }
.wbar b { font-weight: 500; font-size: 13px; }
.wbar.now b { color: var(--rose); }
.wbar small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.week-total { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 14px; font-size: 14px; color: var(--muted); }
.week-total b { color: var(--ink); font-weight: 500; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.pill.pos { background: var(--plus-soft); color: var(--plus); }
.pill.neg { background: var(--min-soft); color: var(--min); }
.pill.zero { background: var(--surface-2); color: var(--muted); }
.pill.abs { background: var(--mauve-soft); color: var(--mauve); }
.pill.hol { background: var(--plus-soft); color: var(--plus); }
.pill.work { background: var(--peach-soft); color: var(--rose); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }

/* Week list */
.days { display: grid; }
.day-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 6px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%; }
.day-row:last-child { border-bottom: 0; }
.day-row:hover { background: var(--surface-2); }
.day-row.today { background: color-mix(in srgb, var(--rose-soft) 55%, transparent); border-radius: 14px; }
.dr-date { display: grid; justify-items: center; line-height: 1.1; }
.dr-date b { font-weight: 500; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.dr-date span { font-family: var(--f-display); font-size: 24px; }
.dr-main { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.dr-main .muted { font-size: 14px; }
.dr-right { text-align: right; display: grid; justify-items: end; gap: 2px; }
.dr-right b { font-weight: 500; }
.dr-right small { color: var(--muted); font-size: 12px; }
.totals-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.totals-row div { min-width: 0; }
.totals-row b { display: block; font-family: var(--f-display); font-weight: 300; font-size: 24px; line-height: 1.2; }
.totals-row b.pos { color: var(--plus); } .totals-row b.neg { color: var(--min); }
@media (max-width: 520px) { .totals-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Tables */
.table-wrap { overflow-x: auto; margin: 0 -4px; }
table.ledger { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 520px; }
.ledger th { text-align: right; font-weight: 500; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.ledger th:first-child, .ledger td:first-child { text-align: left; }
.ledger td { text-align: right; padding: 9px 6px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.ledger tr:last-child td { border-bottom: 0; }
.ledger td.pos { color: var(--plus); } .ledger td.neg { color: var(--min); }
.ledger tr.start td { color: var(--muted); font-style: italic; }
.ledger td.cap { text-transform: capitalize; }

/* Leave counters */
.leave { display: grid; gap: 18px; }
.leave-row { display: grid; gap: 6px; }
.leave-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.leave-top b { font-weight: 500; }
.leave-top .left { font-family: var(--f-display); font-size: 22px; font-weight: 300; }
.leave-top .left small { font-family: var(--f-body); font-size: 13px; color: var(--muted); }
.track { height: 9px; border-radius: 999px; background: var(--surface-2); position: relative; overflow: hidden; display: flex; }
.track i { display: block; height: 100%; }
.track i.used { background: var(--rose); } .track i.plan { background: var(--peach); opacity: .7; } .track i.before { background: var(--faint); }
.leave-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
.leave-meta b { color: var(--ink); font-weight: 500; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

.hol-list { display: grid; }
.hrow { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }
.hrow:last-child { border-bottom: 0; }
.hrow .d { color: var(--muted); }
.hrow .n { min-width: 0; }
.hrow .n small { display: block; color: var(--muted); font-size: 12px; }
.hrow.past { opacity: .6; }
.lfilter { margin-bottom: 6px; }
.lgroup { margin-top: 14px; }
.lgroup-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding-bottom: 6px; border-bottom: 1px solid var(--line); font-size: 14px; }
.lgroup-head span { color: var(--muted); font-size: 13px; }
.lrow { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto 18px; gap: 10px; align-items: center; width: 100%; padding: 10px 4px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; color: var(--ink); font-size: 14px; border-radius: 10px; }
.lrow:hover { background: var(--surface-2); }
.lrow .d { color: var(--muted); font-size: 13px; } .lrow .d b { color: var(--ink); font-weight: 500; margin-right: 5px; }
.lrow .n { min-width: 0; } .lrow .n small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .edit { color: var(--faint); }
.vd { padding: 12px 0; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.vd-head { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; }
.vd-head .d { color: var(--muted); font-size: 13px; } .vd-head .d b { color: var(--ink); font-weight: 500; margin-right: 5px; }
.vd-head .n small { display: block; color: var(--muted); font-size: 12px; }
.vd-take { display: grid; grid-template-columns: minmax(0, 1fr) auto auto 18px; gap: 10px; align-items: center; margin-left: 84px; padding: 7px 10px; border: 0; border-radius: 12px; background: var(--surface-2); color: var(--ink); text-align: left; font-size: 14px; }
.vd-take small { color: var(--muted); font-size: 12px; } .vd-take .edit { color: var(--faint); }
.vd-take:hover .edit { color: var(--rose); }
.vd-take.past { opacity: .7; }
.vd-pick { justify-self: start; margin-left: 84px; }
@media (max-width: 520px) { .vd-take, .vd-pick { margin-left: 0; } }
.lrow.hol .n { color: var(--plus); } .lrow.hol .n small { color: var(--muted); }
.lrow:hover .edit { color: var(--rose); }
.lrow.past .d, .lrow.past .n, .lrow.past .num { opacity: .7; }
.hrow.edit { grid-template-columns: 82px minmax(0, 1fr) 84px 38px; }
.hrow .hol-min { min-height: 38px; padding: 6px 8px; text-align: center; }
@media (max-width: 520px) { .hrow { grid-template-columns: 70px minmax(0, 1fr) auto; gap: 8px; } .hrow.edit { grid-template-columns: 58px minmax(0, 1fr) 70px 38px; } }

/* Forms */
.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.input { width: 100%; padding: 10px 14px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--surface); min-height: 44px; }
.input:focus { border-color: var(--rose); outline: none; box-shadow: 0 0 0 3px var(--rose-soft); }
textarea.input { min-height: 70px; resize: vertical; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.sched { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.sched .input { padding: 8px 6px; text-align: center; }
@media (max-width: 520px) { .sched { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.sched-card { border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 12px; margin-bottom: 12px; background: var(--surface-2); }
.sched-card .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span { display: block; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; }
.chip input:checked + span { background: var(--rose-soft); border-color: var(--rose); color: var(--ink); }
.chip input:focus-visible + span { outline: 2px solid var(--rose); outline-offset: 2px; }
.quick-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.quick-chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.quick-chips button:hover { background: var(--rose-soft); }
.preview { padding: 12px 14px; border-radius: var(--r-ctl); background: var(--peach-soft); font-size: 14px; }
.preview b { font-weight: 600; }
.form-error { color: var(--min); background: var(--min-soft); padding: 10px 14px; border-radius: var(--r-ctl); margin: 0; font-size: 14px; }
.stack { display: grid; gap: 14px; }
.settings-section + .settings-section { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line); }
.settings-section h3 { font-family: var(--f-display); font-weight: 400; font-size: 18px; margin: 0 0 4px; }
.saved-note { color: var(--plus); font-size: 14px; }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 50; display: grid; align-items: end; justify-items: center; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(40, 20, 30, .38); backdrop-filter: blur(2px); }
.sheet-panel { position: relative; width: min(560px, 100%); max-height: min(92vh, 860px); overflow-y: auto; background: var(--surface); border-radius: 28px 28px 0 0; padding: 22px 22px calc(22px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 40px rgba(60, 20, 40, .18); }
@media (min-width: 761px) { .sheet { align-items: center; } .sheet-panel { border-radius: 28px; } }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }

.sheet-head .nav .btn { white-space: nowrap; }
.day-sum { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 12px; border-radius: 18px; background: var(--surface-2); margin-bottom: 8px; }
.day-sum div { text-align: center; min-width: 0; }
.day-sum b { display: block; font-family: var(--f-display); font-weight: 300; font-size: 20px; }
.day-sum small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.plan-btn { border: 1px dashed var(--faint); background: transparent; border-radius: 14px; padding: 4px 2px; color: var(--ink); text-align: center; min-width: 0; }
.plan-btn:hover { background: var(--rose-soft); border-color: var(--rose); }
.plan-btn.changed { border-style: solid; border-color: var(--peach); background: var(--peach-soft); }
.pill.plan { background: var(--peach-soft); color: var(--warn); }
.form-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; margin-top: 6px; }

.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 999px; font-weight: 500; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
@media (min-width: 761px) { .toast { bottom: 28px; } }
.sync-pill { position: fixed; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; max-width: 340px; padding: 10px 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 13px; }
.sync-pill.warn { background: var(--warn-soft); }
.sync-pill button { border: 0; background: var(--rose); color: var(--on-accent); border-radius: 999px; padding: 4px 12px; font-weight: 500; }
.sync-pill small { flex-basis: 100%; color: var(--muted); }
@media (min-width: 761px) { .sync-pill { bottom: 20px; } }
.loading { text-align: center; padding: 80px 16px; color: var(--muted); }
.loading .brand-mark { width: 54px; height: 54px; animation: spin 6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.version { margin: 14px 0 0; color: var(--faint); font-size: 12px; }
a.link { color: var(--rose); font-weight: 500; }
</style>
</head>

<script>
(() => {
  "use strict";
  const APP_VERSION = "2.5 (halve dag verplaatsen telt de uren over)";
  const $ = s => document.querySelector(s);
  const viewEl = $("#view"), bannerEl = $("#banner");

  /* ---------- Small helpers ---------- */
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const todayStr = () => ymd(new Date());
  const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
  const dow = s => parseD(s).getDay();
  const mondayOf = s => addDays(s, -((dow(s) + 6) % 7));
  const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || "");
  const toMin = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t || ""); return m ? +m[1] * 60 + +m[2] : null; };
  const clock = m => pad(Math.floor(((m % 1440) + 1440) % 1440 / 60)) + ":" + pad(((m % 60) + 60) % 60);
  const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
  function hm(min, signed) {
    min = Math.round(min || 0);
    const a = Math.abs(min), s = Math.floor(a / 60) + "u" + pad(a % 60);
    return min < 0 ? "−" + s : (signed && a ? "+" + s : s);
  }
  function parseDur(s) {
    s = String(s == null ? "" : s).trim().replace(/\s/g, "").toLowerCase();
    if (!s) return NaN;
    let neg = false;
    if (/^[-−]/.test(s)) { neg = true; s = s.slice(1); } else if (s[0] === "+") s = s.slice(1);
    let v; const m = /^(\d+)[u:h](\d{1,2})?$/.exec(s);
    if (m) v = +m[1] * 60 + +(m[2] || 0);
    else if (/^\d+([.,]\d+)?$/.test(s)) v = Math.round(parseFloat(s.replace(",", ".")) * 60);
    else return NaN;
    return neg ? -v : v;
  }
  const DAYS = ["zondag", "maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag"];
  const DSHORT = ["zo", "ma", "di", "wo", "do", "vr", "za"];
  const MONTHS = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"];
  const fmtDate = s => { const d = parseD(s); return DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()]; };
  const fmtShort = s => { const d = parseD(s); return d.getDate() + " " + MONTHS[d.getMonth()].slice(0, 3); };
  const fmtLong = s => { const d = parseD(s); return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear(); };
  function isoWeek(s) {
    const d = parseD(s); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
    const w1 = new Date(d.getFullYear(), 0, 4);
    return 1 + Math.round(((d - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7);
  }
  const fmtNum = (n, d) => n.toLocaleString("nl-BE", { maximumFractionDigits: d == null ? 1 : d });
  const signCls = m => m > 0 ? "pos" : m < 0 ? "neg" : "zero";

  /* ---------- Absence types ---------- */
  // credit: counts as worked time for your plus/min balance. budget: has a yearly right you can set.
  const TYPES = [
    { code: "thuiswerk", label: "Thuiswerk", short: "TW", credit: true },
    { code: "verlof", label: "Wettelijk verlof", short: "WV", credit: true, budget: true },
    { code: "extralegaal", label: "Extralegaal verlof", short: "EV", credit: true, budget: true },
    { code: "ander_verlof", label: "Ander verlof (anciënniteit, …)", short: "AV", credit: true, budget: true },
    { code: "vervangdag", label: "Vervanguren feestdagen", short: "VD", credit: true, budget: "auto" },
    { code: "recup", label: "Recup (plus-uren opnemen)", short: "R", credit: false },
    { code: "ziekte", label: "Ziekte", short: "Z", credit: true },
    { code: "opleiding", label: "Opleiding / vorming", short: "O", credit: true },
    { code: "klein_verlet", label: "Klein verlet", short: "KV", credit: true },
    { code: "onbetaald", label: "Onbetaald verlof", short: "OV", credit: true },
    { code: "ander", label: "Andere afwezigheid", short: "A", credit: true }
  ];
  const typeOf = c => TYPES.find(t => t.code === c) || TYPES[TYPES.length - 1];

  /* ---------- State ---------- */
  const DEFAULT_CFG = () => ({
    schedules: [{ from: "2000-01-01", days: [0, 456, 456, 228, 456, 456, 0] }], // zondag eerst
    pauseDefault: 30, pauseAfter: 360, fullDay: 456, extraHolidayMin: 412,
    startDate: todayStr(), startBalance: 0, rights: {}
  });
  // WEB: the stand-alone web app for colleagues (TimeAura/web), which keeps everything on the device.
  const WEB = !!window.TIMEAURA_WEB;
  const BACKUP_KEY = "timeaura-lastbackup";
  const backupDue = () => { try { const t = +localStorage.getItem(BACKUP_KEY) || 0; return (state.reg.length + state.abs.length) > 0 && Date.now() - t > 30 * 864e5; } catch (e) { return false; } };
  const state = { view: "vandaag", reg: [], abs: [], hol: [], cfg: null, loaded: false, weekOf: mondayOf(todayStr()), year: new Date().getFullYear(), sheetUrl: "", db: null, settingsMsg: null };
  let idx = { reg: new Map(), abs: new Map(), hol: new Map() };
  function cfg() { return Object.assign(DEFAULT_CFG(), state.cfg || {}); }
  function reindex() {
    const group = (list, key) => { const m = new Map(); list.forEach(x => { if (!isDate(x.date)) return; if (!m.has(x.date)) m.set(x.date, []); m.get(x.date).push(x); }); return m; };
    idx.reg = group(state.reg); idx.abs = group(state.abs); idx.hol = group(state.hol);
    idx.reg.forEach(l => l.sort((a, b) => (toMin(a.start) || 0) - (toMin(b.start) || 0)));
  }

  /* ---------- Time rules ---------- */
  function scheduleFor(date) {
    const list = cfg().schedules.slice().sort((a, b) => a.from < b.from ? -1 : 1);
    let s = list[0];
    list.forEach(x => { if (x.from <= date) s = x; });
    return s;
  }
  // What a day asks by your weekly schedule, and what it asks after a change for that one day
  // (for example when you move your half day from Wednesday to Friday).
  const baseMin = date => (scheduleFor(date).days[dow(date)] || 0);
  const overrideOf = date => { const o = cfg().dayOverrides; return o && o[date] !== undefined && o[date] !== null && !isNaN(+o[date]) ? +o[date] : null; };
  const plannedMin = date => { const o = overrideOf(date); return o === null ? baseMin(date) : o; };
  const holidayOn = date => (idx.hol.get(date) || [])[0] || null;
  // What a holiday is worth: its own hours if set, else a full day for the legal ones
  // (their id is their date) and the "extra holiday" value for ones you added yourself.
  const isLegalHol = h => /^\d{4}-\d{2}-\d{2}$/.test(h.id || "");
  function holMin(h) {
    if (!h) return 0;
    if (h.min !== undefined && h.min !== null && h.min !== "" && !isNaN(+h.min)) return +h.min;

  const runningReg = () => state.reg.filter(r => !r.end && isDate(r.date)).sort((a, b) => a.date < b.date ? 1 : -1)[0] || null;

  // "ma, di, do en vr 7u36 · wo 3u48": a schedule in words, for the explanations.

  function renderCounters() {
